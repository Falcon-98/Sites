<!DOCTYPE html>
<html lang="en">
<!--
  ════════════════════════════════════════════════════════════════════════
  POSHANA — Sri Lankan Day Balance
  Build your whole day of real Sri Lankan food, then see a meaningful
  outcome: how today's eating pattern shapes your long-term risk of
  non-communicable diseases (NCDs) — with warnings, early symptoms to
  watch, and simple local swaps.
  ────────────────────────────────────────────────────────────────────────
  HTML5 + JavaScript + Tailwind CSS (Play CDN). Single file.
  Real food photos: Wikipedia/Wikimedia Commons (freely licensed),
  with emoji fallback so a food is always recognisable / works offline.
  ────────────────────────────────────────────────────────────────────────
  IMPORTANT: This is general health education, NOT a diagnosis. NCD values
  are simplified for teaching. Confirm with a Sri Lankan doctor/dietitian
  and national guidance before any real-world use. Screening saves lives.
  ════════════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0B1512">
<title>Poshana — Sri Lankan Day Balance</title>
<meta name="description" content="Build a day of Sri Lankan food and learn how it shapes your risk of diabetes, heart disease and other NCDs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
<!-- Perf: no runtime CSS framework (all styles are inline, ~0 blocking). Preconnect image + font hosts. -->
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1512; --bg2:#12211C; --panel:#16271F; --line:#2A4034; --chalk:#EFF5F0; --dim:#A6BDB0;
    --gold:#E9C877; --gold2:#FBE6A8; --leaf:#3FB56B; --spice:#E8843C; --chilli:#E24A4A; --amber:#F0B23C;
    --glass:rgba(50,80,64,.42); --glass2:rgba(70,104,84,.55); --gbrd:rgba(255,255,255,.16);
    --txt:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--chalk);
    font-family:"Public Sans",system-ui,sans-serif;font-size:calc(16px*var(--txt));-webkit-text-size-adjust:100%}
  body{background:radial-gradient(130% 90% at 50% -10%, #1a3128 0%, #0e1a15 55%, #080f0c 100%),#080f0c}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
  .disp{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
  .gold-text{background:linear-gradient(180deg,#FDECB8,#E9C877 55%,#D6A94C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#E9C877}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .btn{border:1px solid rgba(255,255,255,.35);border-radius:16px;background:linear-gradient(180deg,#FFE7BE,#F0C066);color:#241804;font-weight:700;
    padding:14px 22px;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.05rem;
    box-shadow:0 5px 0 #b98a4e,0 12px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.75);transition:transform .1s,box-shadow .1s,filter .1s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b98a4e,0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7)}
  .btn:disabled{opacity:.4;box-shadow:none;transform:none;filter:none}
  .btn-ghost{background:var(--glass);backdrop-filter:blur(12px);color:var(--chalk);border:1px solid var(--gbrd);
    box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12)}
  .btn-ghost:hover{background:var(--glass2);border-color:var(--gold);filter:none}
  .btn:focus-visible,.icon-btn:focus-visible,.food:focus-visible,.meal:focus-visible,.tab:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .icon-btn{width:46px;height:46px;border-radius:13px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--gbrd);
    display:grid;place-items:center;font-size:1.2rem;box-shadow:0 4px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1);
    transition:transform .1s,border-color .12s,background .12s}
  .icon-btn:hover{border-color:var(--gold);background:var(--glass2);transform:translateY(-2px)}
  .icon-btn.home{border-color:var(--gold);color:var(--gold2)}
  #top{align-items:center}
  .panel{background:var(--glass);backdrop-filter:blur(15px) saturate(1.2);border:1px solid var(--gbrd);border-radius:20px;
    box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.13)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* food visual (emoji placeholder → real photo fades in; shimmer while loading) */
  .fv{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.18);isolation:isolate}
  .fv.ld::after{content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.10) 45%,transparent 70%);
    background-size:220% 100%;animation:shimmer 1.1s linear infinite}
  @keyframes shimmer{to{background-position:-220% 0}}
  .fv .emo{position:absolute;inset:0;display:grid;place-items:center;line-height:1;z-index:0}
  .fv img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
  .fv img.on{opacity:1}
  /* screens */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .screen>*{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  /* top bar */
  #top{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
  #top .ttl{flex:1;font-weight:700}
  /* live meters */
  .metbar{display:flex;gap:8px;padding:6px 12px;flex-wrap:wrap;justify-content:center}
  .met{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--gbrd);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600}
  .met .bar{width:44px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
  .met .bar i{display:block;height:100%;border-radius:4px;transition:width .3s,background .3s}
  /* meal tabs */
  .tabs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto}
  .tab{flex:0 0 auto;border-radius:14px;background:var(--glass);border:1px solid var(--gbrd);padding:9px 13px;font-weight:700;font-size:.9rem;
    display:flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
  .tab.on{background:linear-gradient(180deg,#2c4a3a,#1d3327);border-color:var(--gold)}
  .tab .n{background:var(--leaf);color:#08120c;border-radius:999px;font-size:.72rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
  /* meal cards — square tiles, contents visible at a glance */
  .meals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:760px){.meals-grid{grid-template-columns:1fr 1fr 1fr}}
  .meal{border-radius:18px;background:var(--glass);border:1px solid var(--gbrd);padding:10px;cursor:pointer;
    aspect-ratio:1;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .1s}
  .meal:hover{transform:translateY(-2px)}
  .meal.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 22px rgba(233,200,119,.16)}
  .meal h3{margin:0 0 6px;font-size:.92rem;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .meal h3 .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal .cnt{margin-left:auto;background:var(--glass2);border:1px solid var(--gbrd);border-radius:999px;font-size:.74rem;font-weight:700;min-width:22px;text-align:center;padding:1px 8px}
  .meal.active .cnt{background:var(--gold);color:#20160a;border-color:var(--gold)}
  .blocks{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow:auto;min-height:0}
  .blocks::-webkit-scrollbar{width:5px}.blocks::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .blocks .empty{color:var(--dim);font-size:.8rem;line-height:1.3}
  .block{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;
    padding:5px 4px 4px;font-size:.62rem;font-weight:600;color:inherit;font-family:inherit;cursor:pointer;position:relative;width:54px;
    transition:transform .1s,border-color .12s}
  .block:hover{border-color:var(--chalk)}.block:active{transform:scale(.93)}
  .block .fv{width:44px;height:38px;flex:0 0 auto}
  .block .fv .emo{font-size:1.5rem}
  .block>span:not(.x){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .block .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#c0394f;color:#fff;
    border:1px solid var(--bg);font-size:.62rem;display:grid;place-items:center;opacity:0;transition:opacity .12s}
  .block:hover .x,.block:focus .x{opacity:1}
  @media(hover:none){.block .x{opacity:1}}
  .block.warn{border-color:var(--amber)} .block.bad{border-color:var(--chilli)}
  .block.new{animation:blockin .22s cubic-bezier(.2,1.5,.5,1)}
  @keyframes blockin{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
  .met.score{background:linear-gradient(180deg,#2c4a3a,#1d3327);border-color:var(--gold);color:var(--gold2)}
  /* shelf */
  #shelf{display:flex;gap:10px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  #shelf::-webkit-scrollbar{height:7px}#shelf::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .food{position:relative;flex:0 0 auto;width:96px;min-height:120px;border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);
    border:1px solid var(--gbrd);padding:7px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 5px 14px rgba(0,0,0,.3);transition:transform .1s,border-color .1s}
  .food:hover{transform:translateY(-3px);border-color:var(--gold)}.food:active{transform:scale(.95)}
  .food .fv{width:74px;height:56px}.food .fv .emo{font-size:2.1rem}
  .food .nm{font-size:.78rem;font-weight:600;text-align:center;line-height:1.05}
  .food .si{font-size:.68rem;color:var(--dim);text-align:center;line-height:1}
  .food-i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;z-index:2;background:rgba(8,15,12,.75);
    border:1px solid var(--gbrd);color:var(--gold2);font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0}
  .food-i:hover{background:var(--gold);color:#20160a}
  .ntag{display:inline-block;background:var(--glass2);border:1px solid var(--gbrd);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;margin:3px 2px}
  /* doors / cards */
  .door{padding:20px;border-radius:22px;background:var(--glass);backdrop-filter:blur(15px);border:1px solid var(--gbrd);
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;transition:transform .14s,border-color .14s;box-shadow:0 10px 30px rgba(0,0,0,.34);margin-bottom:12px}
  .door:hover{transform:translateY(-3px);border-color:var(--gold)}
  .door .g{font-size:2.4rem}.door .n{font-weight:700;font-size:1.14rem}.door .s{color:var(--dim);font-size:.88rem}
  /* risk meters */
  .risk{background:var(--glass);border:1px solid var(--gbrd);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .risk .rh{display:flex;align-items:center;gap:8px;font-weight:700}
  .risk .rlvl{margin-left:auto;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px}
  .risk .bar{height:12px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:8px}
  .risk .bar i{display:block;height:100%;border-radius:7px;transition:width .5s}
  .lvl-low{background:rgba(63,181,107,.22);color:#9ff0bf} .lvl-mid{background:rgba(240,178,60,.2);color:#ffd98a} .lvl-high{background:rgba(226,74,74,.22);color:#ff9d9d}
  .warncard{border:1px solid var(--gbrd);border-left-width:5px;border-radius:14px;padding:14px;margin-bottom:10px;background:var(--glass);text-align:left}
  .warncard.mid{border-left-color:var(--amber)} .warncard.high{border-left-color:var(--chilli)} .warncard.good{border-left-color:var(--leaf)}
  .warncard ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:.9rem} .warncard li{margin:2px 0}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;margin:4px}
  .stars{font-size:1.5rem;letter-spacing:2px}
  /* tower */
  .tower{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;margin:6px 0}
  .trow{height:16px;border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  #modal{position:fixed;inset:0;background:rgba(6,12,9,.82);backdrop-filter:blur(7px);display:none;place-items:center;padding:18px;z-index:60}
  #modal.open{display:grid}
  #modal>.panel{animation:pop .28s cubic-bezier(.2,1.4,.5,1) both;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:20px}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .fi-row{text-align:left;padding:10px 12px;background:var(--glass);border:1px solid var(--gbrd);border-radius:13px;margin-bottom:8px}
  #stars-bg{position:fixed;inset:0;pointer-events:none;opacity:.4;z-index:0}
  #stars-bg i{position:absolute;width:2px;height:2px;border-radius:50%;background:#bfe6cf;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
  #app>*{position:relative;z-index:1}
  /* ── landing / home page ── */
  #home-scroll{scroll-behavior:smooth}
  .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:rgba(8,15,12,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--gbrd)}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.25rem;flex:0 0 auto}
  .nav-links{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .nav-links>button{background:none;border:0;color:var(--dim);font-weight:600;font-size:.9rem;padding:8px 10px;border-radius:10px}
  .nav-links>button:hover{color:var(--chalk);background:var(--glass)}
  .nav-cta{background:linear-gradient(180deg,#FFFFFF,#F1F6EF)!important;color:#123!important;
    border:1px solid rgba(255,255,255,.85)!important;padding:10px 18px!important;min-height:0!important;font-size:.92rem!important;
    box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05)!important;border-radius:12px!important}
  .nav-cta:hover{filter:brightness(1)!important;background:#fff!important;transform:translateY(-1px)}
  .hero{max-width:720px;margin:0 auto;padding:34px 20px 12px;text-align:center}
  .hero-badge{display:inline-block;background:var(--glass2);border:1px solid var(--gbrd);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600;margin-bottom:14px}
  .hero h1{font-size:clamp(2rem,7vw,3rem);line-height:1.06;margin:0 0 14px}
  .lead{color:var(--dim);line-height:1.6;font-size:1.02rem;max-width:640px;margin:0 auto}
  .hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 10px}
  .hero-stat{color:var(--dim);font-size:.86rem;margin-top:6px}
  .sec{max-width:720px;margin:0 auto;padding:26px 20px;border-top:1px solid var(--gbrd)}
  .sec h2{font-size:1.5rem;margin:0 0 14px;text-align:center}
  .cards3{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:640px){.cards3{grid-template-columns:1fr 1fr 1fr}}
  .fcard{background:var(--glass);border:1px solid var(--gbrd);border-radius:16px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.28)}
  .fcard .fic{font-size:2rem}.fcard h3{margin:8px 0 6px;font-size:1.05rem}.fcard p{margin:0;color:var(--dim);font-size:.9rem;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chips .chip{background:var(--glass2);border:1px solid var(--gbrd);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
  .credits{background:var(--glass);border:1px solid var(--gbrd);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .crow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
  .crow span{color:var(--dim)} .crow b{text-align:right}
  .credits .fine{margin:12px 0 0;color:var(--dim);font-size:.82rem;line-height:1.5}
  .foot{text-align:center;color:var(--dim);font-size:.82rem;padding:22px 20px calc(28px + env(safe-area-inset-bottom))}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#home-scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="stars-bg"></div>
<div id="app">
  <div id="top" hidden>
    <button id="b-home" class="icon-btn home" aria-label="Back to home" title="Home">🏠</button>
    <div class="ttl" id="top-ttl"></div>
    <button id="b-info" class="icon-btn" aria-label="Learn about NCDs" title="NCD guide">📖</button>
    <button id="b-about" class="icon-btn" aria-label="About" title="About">ⓘ</button>
  </div>
  <div id="screen" class="screen"></div>
  <div id="bottom" hidden>
    <div id="shelf" role="group" aria-label="Foods you can add"></div>
    <div id="actions" style="display:flex;gap:10px;justify-content:center;padding:4px 14px calc(12px + env(safe-area-inset-bottom))"></div>
  </div>
</div>
<p id="live" class="sr-only" aria-live="polite"></p>
<div id="modal" role="dialog" aria-modal="true"></div>
<noscript><p style="padding:2rem">Poshana needs JavaScript to run.</p></noscript>

<script>

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sum=(a,k)=>a.reduce((s,i)=>s+(i[k]||0),0);
function live(t){$('#live').textContent=t;}
function foodVisual(def){
  const w=el('div','fv'); w.append(el('div','emo',def.emoji));
  const u=IMG[def.id];
  if(u){ w.classList.add('ld'); const im=new Image(); im.alt=def.name; im.loading='lazy'; im.decoding='async';
    im.onload=()=>{ im.classList.add('on'); w.classList.remove('ld'); const e=w.querySelector('.emo'); if(e)e.style.opacity=.001; };
    im.onerror=()=>{ im.remove(); w.classList.remove('ld'); }; im.src=u; w.append(im); }
  return w;
}

/* ═══ SCORING: build totals → NCD risks → day balance ═══ */
function score(day){
  const items=[].concat(...MEALS.map(m=>day[m[0]].map(id=>FOOD[id]))).filter(Boolean);
  const n=items.length||1;
  const t={sugar:sum(items,'sugar'),salt:sum(items,'salt'),oil:sum(items,'oil'),refined:sum(items,'refined'),fibre:sum(items,'fibre')};
  const vegCount=items.filter(i=>i.veg).length;
  const proteinCount=items.filter(i=>i.protein).length;
  const friedCount=items.filter(i=>i.fried).length;
  const sugaryDrinks=items.filter(i=>i.group==='drink'&&i.sugar>=2).length;
  const distinctVeg=new Set(items.filter(i=>i.veg).map(i=>i.id)).size;
  // risks 0..1 (thresholds tuned so a typical junky day → high, balanced day → low)
  const risks={
    diabetes:clamp(t.sugar/12*0.5 + t.refined/12*0.3 + sugaryDrinks/3*0.25 - t.fibre/14*0.3),
    heart:   clamp(t.oil/12*0.5 + friedCount/5*0.3 + t.salt/12*0.25 - vegCount/7*0.2),
    bp:      clamp(t.salt/9*0.9 - vegCount/8*0.12),
    obesity: clamp(t.oil/12*0.28 + t.sugar/12*0.28 + t.refined/12*0.28 + friedCount/5*0.2 - t.fibre/14*0.2 - vegCount/7*0.18),
    liver:   clamp(t.sugar/12*0.45 + friedCount/5*0.3 + t.refined/12*0.25 - t.fibre/14*0.2)
  };
  const avg=(risks.diabetes+risks.heart+risks.bp+risks.obesity+risks.liver)/5;
  let dayScore=Math.round(clamp(100 - avg*95 + Math.min(vegCount,5)*3 + Math.min(t.fibre,10)*1.2 + (proteinCount>=2?4:0) - (sugaryDrinks*4) - (friedCount*3), 0,100));
  return {items,t,risks,avg,dayScore,vegCount,proteinCount,friedCount,sugaryDrinks,distinctVeg};
}
function lvl(v){ return v>=0.62?'high':v>=0.38?'mid':'low'; }
function badges(s){
  const b=[];
  if(s.t.salt<=3) b.push(['🧂','Salt Smart']);
  if(s.t.sugar<=3&&s.sugaryDrinks===0) b.push(['🍬','Sugar Aware']);
  if(s.t.fibre>=8) b.push(['🌾','Fibre Hero']);
  if(s.distinctVeg>=5) b.push(['🌈','Rainbow Day']);
  if(s.t.oil<=4&&s.friedCount<=1) b.push(['❤️','Heart Friendly']);
  if(s.dayScore>=75) b.push(['🏆','Balanced Day']);
  return b;
}

let mealBlocks={}, goBtn=null;   // refs for incremental updates (no full re-render per tap)
function blockNode(k,id,fresh){
  const def=FOOD[id]; if(!def)return null;
  const risky=def.fried||def.sugar>=3||def.salt>=3, warn=def.sugar>=2||def.salt>=2||def.oil>=2;
  const bl=el('button','block'+(risky?' bad':warn?' warn':'')+(fresh?' new':'')); bl.type='button';
  bl.setAttribute('aria-label','Remove '+def.name+' from '+MEAL_NAME[k]);
  bl.append(foodVisual(def)); bl.append(el('span',null,def.name)); bl.append(el('span','x','✕'));
  bl.onclick=e=>{ e.stopPropagation(); removeBlock(k,bl); };
  return bl;
}
function fillBlocks(k){
  const box=mealBlocks[k]; box.innerHTML='';
  if(!State.day[k].length){ box.append(el('span','empty','Select this meal, then tap foods below.')); return; }
  State.day[k].forEach(id=>box.append(blockNode(k,id,false)));
}
function addBlock(k,id){
  State.day[k].push(id);
  const box=mealBlocks[k]; const empty=box.querySelector('.empty'); if(empty)empty.remove();
  box.append(blockNode(k,id,true));
  updateCount(k); updateLive(); live(FOOD[id].name+' added to '+MEAL_NAME[k]);
}
function removeBlock(k,node){
  const idx=[...node.parentNode.children].indexOf(node);
  State.day[k].splice(idx,1); node.remove();
  if(!State.day[k].length) mealBlocks[k].append(el('span','empty','Select this meal, then tap foods below.'));
  updateCount(k); updateLive();
}
function updateCount(k){ const c=$('#cnt-'+k); if(c) c.textContent=State.day[k].length; }
function setActive(k){ State.active=k;
  document.querySelectorAll('.meal').forEach(m=>{ const on=m.dataset.k===k; m.classList.toggle('active',on); m.setAttribute('aria-pressed',on); });
  buildShelf(k);
}

  renderMeters(); buildShelf(State.active);
  const reset=el('button','btn btn-ghost','↺ Reset'); reset.onclick=()=>{ State.day=State.challenge?.preset?JSON.parse(JSON.stringify(State.challenge.preset)):emptyDay(); renderBuild(); };
  goBtn=el('button','btn',`See my day's health →`); goBtn.onclick=()=>show('outcome');
  Actions.append(reset,goBtn); updateLive();
}
function renderMeters(){
  let m=$('#meters'); if(!m){ m=el('div','metbar'); m.id='meters'; Top.after(m); }
  updateLive();
}
function updateLive(){
  const m=$('#meters'); if(!m)return; const s=score(State.day);
  const met=(ic,label,val,max)=>{ const pct=clamp(val/max)*100; const col=pct>66?'var(--chilli)':pct>40?'var(--amber)':'var(--leaf)';
    return `<div class="met">${ic} ${label}<div class="bar"><i style="width:${pct}%;background:${label==='Fibre'?'var(--leaf)':col}"></i></div></div>`; };
  const total=[].concat(...Object.values(State.day)).length;
  m.innerHTML = `<div class="met score" title="Day Balance">💚 ${total?s.dayScore:'--'}<span style="opacity:.6">/100</span></div>`
    + met('🍬','Sugar',s.t.sugar,14)+met('🧂','Salt',s.t.salt,12)+met('🛢️','Oil',s.t.oil,14)+met('🌾','Fibre',s.t.fibre,12)
    + `<div class="met">🥗 ${s.vegCount}</div>`;
  if(goBtn) goBtn.disabled = total===0;
}
function buildShelf(meal){
  Shelf.innerHTML='';
  const list=FOOD_DB;   // every food is selectable for every meal
  Shelf.append(el('div',null,`<div style="align-self:center;color:var(--dim);font-size:.78rem;padding:0 4px;white-space:nowrap">Adding to<br><b style="color:var(--gold)">${MEAL_NAME[meal]}</b></div>`));
  list.forEach(def=>{ const b=el('button','food'); b.setAttribute('aria-label',`${def.name}. Add to ${MEAL_NAME[meal]}.`);
    b.append(foodVisual(def)); b.append(el('div','nm',def.name)); b.append(el('div','si',def.si||''));
    const info=el('button','food-i','ⓘ'); info.type='button'; info.setAttribute('aria-label','About '+def.name);
    info.onclick=e=>{ e.stopPropagation(); foodInfo(def); }; b.append(info);
    b.onclick=()=>addBlock(meal,def.id);
    Shelf.append(b);
  });
}

/* food info modal: portion + what you get + how it affects NCD risk */
const NUTRI_HINT=def=>{
  const out=[];
  if(def.veg) out.push('Fibre & vitamins');
  if(def.protein) out.push('Protein');
  if(def.group==='fruit') out.push('Natural sweetness & fibre');
  if(def.fibre>=2) out.push('Good fibre');
  if(def.sugar>=2) out.push('⚠ High free sugar');
  if(def.salt>=2) out.push('⚠ High salt');
  if(def.oil>=2||def.fried) out.push('⚠ Fried / high oil');
  if(def.refined>=2) out.push('⚠ Refined carb');
  return out.length?out:['Everyday food'];
};
const PORTION={grain:'A fist of rice / 1–2 pieces',protein:'A palm-size piece',veg:'Fill half the plate',fruit:'One piece / a handful',
  drink:'One cup/glass',sweet:'A small piece, now and then',fried:'One or two, occasionally',snack:'A small amount',dairy:'A small cup'};
function foodInfo(def){
  const risky=[]; if(def.sugar>=2)risky.push('diabetes & fatty liver'); if(def.salt>=2)risky.push('blood pressure'); if(def.oil>=2||def.fried)risky.push('heart & weight'); if(def.refined>=3)risky.push('diabetes');
  openModal(`<div style="text-align:center">
    <div id="fi-vis" style="width:130px;height:96px;margin:0 auto 8px;border-radius:14px;overflow:hidden"></div>
    <div class="disp" style="font-size:1.3rem">${def.name}</div>
    <div style="color:var(--dim);margin:2px 0 12px">${def.si||''}</div>
    <div class="fi-row"><b>🖐 Portion</b><div style="color:var(--dim);margin-top:2px">${PORTION[def.group]||'A small serving'}</div></div>
    <div class="fi-row"><b>💪 What it gives</b><div style="margin-top:5px">${NUTRI_HINT(def).map(n=>`<span class="ntag">${n}</span>`).join(' ')}</div></div>
    ${risky.length?`<div class="fi-row" style="border-color:var(--amber)"><b>⚠ Eaten often, this adds to</b><div style="color:var(--dim);margin-top:2px">${[...new Set(risky)].join(', ')} risk</div></div>`:''}
    <div class="fi-row"><b>💡 Tip</b><div style="color:var(--dim);margin-top:2px">${def.tip||''}</div></div>
    <button class="btn" style="width:100%;margin-top:6px" data-close>Close</button></div>`);
  const v=$('#fi-vis'); if(v){ const fv=foodVisual(def); fv.style.width='100%'; fv.style.height='100%'; fv.style.borderRadius='14px'; v.append(fv); }
}

function renderOutcome(){
  const s=score(State.day); TopTtl.textContent="Your day's outcome";
  Save.daysDone++; Save.best=Math.max(Save.best,s.dayScore);
  const earned=badges(s); earned.forEach(([e,n])=>{ if(!Save.badges.includes(n))Save.badges.push(n); }); flush();
  const c=el('div','scroll'); const w=el('div','wrap');
  const stars=Math.max(1,Math.round(s.dayScore/20));
  const verdict = s.dayScore>=75?'A well-balanced day! 💚' : s.dayScore>=50?'A fair day — a few easy wins left.' : 'This pattern needs some rebalancing.';
  w.append(el('div','panel',`<div style="padding:16px;text-align:center">
     <div class="disp" style="font-size:1.5rem">${verdict}</div>
     <div class="stars" style="margin:6px 0">${'⭐'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
     <div style="color:var(--dim)">Day Balance <b style="color:var(--chalk)">${s.dayScore}/100</b> · ${s.items.length} items · 🥗 ${s.vegCount} veg · 🌾 fibre ${s.t.fibre}</div>
     ${State.challenge&&State.challenge.target?`<div style="margin-top:6px;color:${s.dayScore>=State.challenge.target?'var(--leaf)':'var(--amber)'}">${s.dayScore>=State.challenge.target?'✓ Challenge target met!':`Target ${State.challenge.target} — keep rebalancing`}</div>`:''}
   </div>`));
  // NCD projection heading
  w.append(el('div','disp',`<div style="font-size:1.15rem;margin:16px 0 8px">🔮 If most of your days looked like this…</div>`));
  const order=Object.keys(NCD).map(k=>[k,s.risks[k]]).sort((a,b)=>b[1]-a[1]);
  order.forEach(([k,v])=>{ const L=lvl(v), d=NCD[k]; const pct=Math.round(v*100);
    const r=el('div','risk'); r.innerHTML=`<div class="rh">${d.icon} ${d.name}
      <span class="rlvl ${L==='high'?'lvl-high':L==='mid'?'lvl-mid':'lvl-low'}">${L==='high'?'Higher risk':L==='mid'?'Watch this':'Lower risk'}</span></div>
      <div class="bar"><i style="width:${Math.max(6,pct)}%;background:${L==='high'?'var(--chilli)':L==='mid'?'var(--amber)':'var(--leaf)'}"></i></div>`;
    w.append(r);
  });
  // warnings for mid/high risks
  const flagged=order.filter(([k,v])=>lvl(v)!=='low');
  if(flagged.length){
    w.append(el('div','disp',`<div style="font-size:1.15rem;margin:16px 0 8px">⚠️ What to know & watch</div>`));
    flagged.forEach(([k,v])=>{ const d=NCD[k], L=lvl(v);
      w.append(el('div','warncard '+L,`<div style="font-weight:700;display:flex;align-items:center;gap:8px">${d.icon} ${d.name}</div>
        <div style="color:var(--dim);font-size:.9rem;margin:6px 0">${d.build}</div>
        <div style="font-weight:600;font-size:.9rem">Early signs to watch:</div>
        <ul>${d.symptoms.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div style="margin-top:8px;padding:8px 10px;background:rgba(63,181,107,.12);border-radius:10px;font-size:.9rem"><b>✅ Try this:</b> ${d.swap}</div>`));
    });
  } else {
    w.append(el('div','warncard good',`<div style="font-weight:700">💚 Low risk across the board — well done!</div>
      <div style="color:var(--dim);font-size:.9rem;margin-top:4px">Plenty of vegetables and fibre, and sugar, salt and oil kept in check. Keep this pattern and stay active. Even so, regular screening (blood sugar & blood pressure) is wise for every adult.</div>`));
  }
  // badges
  if(earned.length){ const bx=el('div',null,'<div class="disp" style="font-size:1.1rem;margin:16px 0 6px">🎖️ Badges earned today</div>');
    const row=el('div'); earned.forEach(([e,n])=>row.append(el('span','badge',`${e} ${n}`))); bx.append(row); w.append(bx); }
  // disclaimer
  w.append(el('div','warncard',`<div style="font-size:.84rem;color:var(--dim)"><b>Remember:</b> this is general education, not a diagnosis. One day does not decide anything — but the pattern of your days adds up over years. NCDs are largely preventable. If you have any symptoms or concerns, or for routine screening, please see a doctor or dietitian.</div>`));
  // actions
  const row=el('div',null); row.style.cssText='display:flex;gap:10px;margin:6px 0 20px';
  const rb=el('button','btn btn-ghost','↩ Rebuild this day'); rb.style.flex='1'; rb.onclick=()=>show('build');
  const nx=el('button','btn','New day'); nx.style.flex='1'; nx.onclick=()=>show('menu');
  row.append(rb,nx); w.append(row);
  const old=$('#meters'); if(old)old.remove();
  c.append(w); Screen.append(c);
}

/* ═══ MODAL ═══ */
function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="panel">${html}</div>`; m.classList.add('open');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal); m.onclick=e=>{if(e.target===m)closeModal();}; }
function closeModal(){ const m=$('#modal'); m.classList.remove('open'); m.innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* ═══ NCD LIBRARY (top bar 📖) ═══ */
function openNCDLib(){ let html='<div class="disp" style="font-size:1.3rem;margin-bottom:10px">📖 Know your NCDs</div>';
  for(const k in NCD){ const d=NCD[k]; html+=`<div class="warncard" style="border-left-color:${d.col}">
    <div style="font-weight:700">${d.icon} ${d.name}</div>
    <div style="color:var(--dim);font-size:.88rem;margin:5px 0">${d.build}</div>
    <div style="font-weight:600;font-size:.88rem">Watch for:</div><ul>${d.symptoms.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div style="margin-top:6px;font-size:.88rem"><b>Prevent:</b> ${d.swap}</div></div>`; }
  html+='<button class="btn" style="width:100%;margin-top:4px" data-close>Close</button>';
  openModal(html);
}
$('#b-info').onclick=openNCDLib;
$('#b-home').onclick=()=>{ const t=[].concat(...Object.values(State.day)).length;
  if(State.screen==='build'&&t>0){ openModal(`<div style="text-align:center"><div class="disp" style="font-size:1.2rem;margin-bottom:8px">Leave this day?</div>
    <p style="color:var(--dim)">Your current day will not be saved.</p>
    <div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" data-close>Stay</button>
    <button class="btn" style="flex:1" id="go-home">Go home</button></div></div>`); $('#go-home').onclick=()=>{closeModal();show('title');}; }
  else show('title'); };
$('#b-about').onclick=()=>openModal(`<div><div class="disp" style="font-size:1.25rem;margin-bottom:8px">About Poshana</div>
  <p style="font-size:.92rem">Poshana ("nutrition") helps Sri Lankan families see how everyday eating — rice & curry, hoppers, short-eats, sweets and sugary tea — shapes long-term risk of non-communicable diseases.</p>
  <p style="font-size:.92rem"><b>It is education, not medical advice.</b> If food, weight or your health feels worrying, a doctor or dietitian can help — and simple screening (blood sugar, blood pressure) finds problems early.</p>
  <p style="font-size:.82rem;color:var(--dim)">Food photos: Wikipedia / Wikimedia Commons. NCD and nutrition values are simplified for teaching and should be reviewed against Sri Lankan clinical guidance before real use. Nothing leaves your device.</p>
  <button class="btn" style="width:100%;margin-top:6px" data-close>Close</button></div>`);

/* ═══ BOOT ═══ */
(function stars(){ const s=$('#stars-bg'); let h=''; for(let i=0;i<40;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*80}%;animation-delay:${(Math.random()*4).toFixed(2)}s"></i>`; s.innerHTML=h; })();
show('title');
</script>
