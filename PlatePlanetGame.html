<!DOCTYPE html>
<html lang="en">
<!--
  ════════════════════════════════════════════════════════════════════════
  PLATE PLANET (2D) — build a balanced plate
  Single-file nutrition game for kids / teens / parents.
  Flat 2D. Real food PHOTOS (TheMealDB, free/no-key) with instant EMOJI
  fallback so a food is always recognisable even offline / on load failure.
  No 3D, no build step, no backend, no data collection.
  ────────────────────────────────────────────────────────────────────────
  Kids mode: minimal words, big targets, spoken food names, no numbers,
    no fail state. Teen/parent modes add numbers as comparisons/planning.
  SAFETY: no calories; no body-size/weight; no moralising words.
  NOTE: nutrition values are placeholders — dietitian sign-off + sourced
    food-composition data required before public release.
  ════════════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0E1726">
<title>Plate Planet — build a balanced plate</title>
<meta name="description" content="A friendly game about balanced plates for kids, teens and parents.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1726; --ink-2:#17233A; --stall:#28374F; --chalk:#F1F5F2; --chalk-dim:#A8B6C6;
    --lamp:#FFD79A; --veg:#37B26B; --fruit:#E24A73; --grain:#E0A83A; --protein:#7C6BE0;
    --dairy:#54C3DE; --sometimes:#94A0B0; --water:#37C3D0; --sugar:#F0A93C; --joy:#FFC24B;
    --glass:rgba(34,50,80,.58); --glass-2:rgba(48,66,102,.72); --glass-brd:rgba(255,255,255,.18);
    --gold:#E9C877; --gold-2:#FBE6A8;
    --txt:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    color:var(--chalk);font-family:"Public Sans",system-ui,sans-serif;font-size:calc(16px*var(--txt));
    -webkit-text-size-adjust:100%}
  /* Warm night-market backdrop + faint stars */
  body{background:
    radial-gradient(130% 90% at 50% -12%, #1d2f52 0%, #111c33 55%, #0a1120 100%),
    #0a1120;}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;
    background:radial-gradient(58% 40% at 50% 46%, rgba(217,178,90,.12), transparent 70%)}
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0}
  #stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe0f0;
    animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
  #app>*{position:relative;z-index:1}
  .display{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
  .gold-text{background:linear-gradient(180deg,#FDECB8 0%,#E9C877 55%,#D6A94C 100%);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:#E9C877;filter:drop-shadow(0 2px 8px rgba(233,200,119,.45))}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .btn{border:1px solid rgba(255,255,255,.35);border-radius:18px;background:linear-gradient(180deg,#FFE7BE,#F3C877);color:#20160a;font-weight:700;
    padding:16px 26px;font-size:1.1rem;min-height:60px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 5px 0 #b98a4e,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s,filter .1s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b98a4e,0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7)}
  .btn:disabled{opacity:.45;box-shadow:none}
  .btn-ghost{background:var(--glass);backdrop-filter:blur(12px);color:var(--chalk);border:1px solid var(--glass-brd);
    box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12)}
  .btn:focus-visible,.food:focus-visible,.icon-btn:focus-visible,.door:focus-visible,.lvl:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .icon-btn{width:50px;height:50px;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--glass-brd);box-shadow:0 4px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
    display:grid;place-items:center;font-size:1.3rem;transition:transform .1s,border-color .1s,background .1s}
  .icon-btn:hover{border-color:var(--gold);background:var(--glass-2);transform:translateY(-2px)}
  .panel{background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--glass-brd);border-radius:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* food visual (emoji under, photo over) */
  .fv{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:50%}
  .fv .emo{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
  .fv img{position:relative;width:90%;height:90%;object-fit:contain;opacity:0;transition:opacity .3s;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .fv img.on{opacity:1}
  /* shelf */
  #shelf{display:flex;gap:12px;overflow-x:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  #shelf::-webkit-scrollbar{height:7px}#shelf::-webkit-scrollbar-thumb{background:var(--stall);border-radius:4px}
  .food{flex:0 0 auto;width:104px;min-height:132px;border-radius:20px;
    background:var(--glass);backdrop-filter:blur(12px) saturate(1.15);border:1px solid var(--glass-brd);
    padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:center;
    transition:transform .12s,border-color .12s,box-shadow .12s,background .12s;
    box-shadow:0 6px 18px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.12)}
  .food:hover{transform:translateY(-3px);border-color:var(--gold);background:var(--glass-2)}
  .food:active{transform:scale(.94)}
  .food.hint{animation:hint 1.4s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.28),0 0 0 0 rgba(255,215,154,.5)}
    50%{box-shadow:0 4px 10px rgba(0,0,0,.28),0 0 0 8px rgba(255,215,154,0)}}
  .food .fv{width:72px;height:72px}
  .food .fv .emo{font-size:2.5rem}
  .food .nm{font-size:.86rem;font-weight:600;text-align:center;line-height:1.05}
  .food .grp{width:100%;height:5px;border-radius:3px}
  .kid .food{width:122px;min-height:152px}.kid .food .fv{width:88px;height:88px}.kid .food .nm{font-size:.98rem}
  /* plate */
  .plate-wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:8px}
  /* Fine bone-china plate: flat cream surface, raised rim, thin gold ring, glass sheen */
  .plate{position:relative;z-index:1;width:min(78vw,460px);height:min(78vw,460px);flex:0 0 auto;border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #ffffff 0%, #f7f2ea 44%, #ece4d4 68%, #ded3bf 100%);
    overflow:hidden;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      0 0 60px rgba(217,178,90,.14),
      inset 0 0 0 7px rgba(255,255,255,.9),
      inset 0 0 0 9px rgba(201,178,90,.55),
      inset 0 0 0 11px rgba(255,255,255,.55),
      inset 0 4px 14px rgba(255,255,255,.9),
      inset 0 -22px 44px rgba(150,128,86,.18);
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;padding:12%}
  /* inner well groove */
  .plate::before{content:"";position:absolute;inset:12%;border-radius:50%;pointer-events:none;z-index:0;
    box-shadow:inset 0 5px 16px rgba(130,108,66,.22),inset 0 -3px 8px rgba(255,255,255,.65),0 1px 0 rgba(255,255,255,.5)}
  /* glass top-left sheen */
  .plate::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
    background:radial-gradient(130% 85% at 28% 16%, rgba(255,255,255,.6), rgba(255,255,255,0) 44%)}
  .plate.empty::after{content:attr(data-hint);position:absolute;inset:0;display:grid;place-items:center;z-index:3;
    color:#7a6f57;font-size:1.02rem;text-align:center;padding:26%;font-weight:600;background:none}
  .placed{width:var(--tok,60px);height:var(--tok,60px);position:relative;flex:0 0 auto;z-index:1;
    background:radial-gradient(ellipse at 50% 82%, rgba(70,52,24,.22), transparent 62%);
    animation:hop .4s cubic-bezier(.2,1.5,.5,1) both}
  .placed .fv{width:100%;height:100%}
  .placed .fv .emo{font-size:calc(var(--tok,60px)*.62)}
  .placed .fv img{filter:drop-shadow(0 5px 6px rgba(60,45,20,.5))}
  .placed .rm{position:absolute;top:-4px;right:-4px;width:max(18px,calc(var(--tok,60px)*.32));height:max(18px,calc(var(--tok,60px)*.32));
    border-radius:50%;background:#d0405a;color:#fff;border:2px solid var(--ink);font-size:.72rem;display:grid;place-items:center;
    line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.4);opacity:0;transition:opacity .15s}
  .plate:hover .placed .rm,.placed:focus-within .rm,.placed.show-rm .rm{opacity:1}
  @media(hover:none){.placed .rm{opacity:1}}
  @keyframes hop{0%{transform:translateY(-46px) scale(.4);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
  /* rainbow (kid aurora) — crowns ABOVE the plate */
  #rainbow{position:absolute;top:-1%;left:50%;transform:translateX(-50%);width:min(101vw,600px);z-index:0;pointer-events:none}
  #rainbow path{fill:none;stroke-width:2.4;opacity:.1;stroke-linecap:round;transition:opacity .5s,stroke-width .5s}
  #rainbow path.on{opacity:.98;stroke-width:2.9;filter:drop-shadow(0 0 3px currentColor)}
  .plate.ready{box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      0 0 52px rgba(55,178,107,.6),
      inset 0 0 0 7px rgba(255,255,255,.9),
      inset 0 0 0 10px rgba(55,178,107,.7),
      inset 0 4px 14px rgba(255,255,255,.9),
      inset 0 -22px 44px rgba(150,128,86,.18)}
  /* live goal pill */
  #goal{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:3;
    background:rgba(16,24,40,.62);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:999px;padding:7px 15px;
    font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:7px;
    box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);
    transition:border-color .25s,background .25s;white-space:nowrap}
  #goal.met{border-color:var(--veg);background:rgba(37,80,55,.75)}
  /* sprout */
  #sprout{position:absolute;bottom:2px;right:6px;font-size:2.8rem;pointer-events:none;z-index:2;
    animation:idle 2.6s ease-in-out infinite;transform-origin:bottom center}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  /* score ring (teen/parent) */
  .ring{position:absolute;top:8px;left:8px;width:66px;height:66px;z-index:2}
  .ring text{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;fill:var(--chalk)}
  /* meters */
  .meter{height:12px;border-radius:7px;background:var(--stall);overflow:hidden}
  .meter>i{display:block;height:100%;border-radius:7px;transition:width .4s}
  /* header */
  #top{display:flex;align-items:center;gap:8px;padding:12px 12px 2px}
  .brief{flex:1;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-brd);border-radius:16px;
    padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;min-height:52px;
    box-shadow:0 8px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.14)}
  .brief .big{font-size:1.5rem;flex:0 0 auto}
  /* screens */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .screen>*{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;overflow:auto}
  .doors{display:grid;gap:14px;width:100%;max-width:600px}
  @media(min-width:640px){.doors{grid-template-columns:1fr 1fr 1fr}}
  .door{padding:24px;border-radius:24px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--glass-brd);
    display:flex;flex-direction:column;align-items:center;gap:6px;min-height:160px;justify-content:center;
    transition:transform .14s,border-color .14s,box-shadow .14s,background .14s;
    box-shadow:0 12px 34px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.14)}
  .door:hover{transform:translateY(-5px);border-color:var(--gold);background:var(--glass-2);box-shadow:0 18px 40px rgba(0,0,0,.46),0 0 22px rgba(217,178,90,.18)}
  .door .g{font-size:3.2rem}.door .n{font-size:1.3rem;font-weight:700}.door .s{color:var(--chalk-dim);font-size:.9rem}
  .lvl{padding:16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-brd);
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:transform .12s,border-color .12s,background .12s;
    box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12)}
  .lvl:hover{transform:translateX(3px);border-color:var(--gold);background:var(--glass-2)}
  .lvl .ic{font-size:1.9rem}.lvl .t{flex:1}.lvl .t b{font-size:1.06rem}.lvl .t span{color:var(--chalk-dim);font-size:.86rem}
  .card{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-brd);border-left-width:5px;border-radius:14px;padding:14px 16px;text-align:left;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
  .card.win{border-color:var(--veg)}.card.next{border-color:var(--lamp)}.card.fact{border-color:var(--dairy)}
  .card.why{border-color:var(--gold)}
  .food{position:relative}
  .food-i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;z-index:2;
    background:rgba(16,24,40,.72);border:1px solid var(--glass-brd);color:var(--gold-2);font-size:.72rem;font-weight:700;
    display:grid;place-items:center;line-height:1;padding:0}
  .food-i:hover{background:var(--gold);color:#20160a}
  .ntag{display:inline-block;background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:999px;
    padding:5px 11px;font-size:.85rem;font-weight:600;margin:3px 2px}
  .fi-row{text-align:left;padding:10px 12px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;margin-bottom:8px}
  .subtitle{color:var(--chalk-dim);font-weight:400;text-align:center;margin-top:6px;max-width:340px;line-height:1.45}
  .purpose{color:var(--chalk-dim);font-size:.92rem;text-align:center;max-width:460px;line-height:1.4;margin:-4px 0 4px}
  .intro{max-width:420px;text-align:center}
  .intro .art{font-size:3.4rem;margin-bottom:8px;line-height:1}
  .intro h3{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;margin:0 0 10px}
  .intro p{color:var(--chalk-dim);line-height:1.55;margin:0 0 16px}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--stall);transition:background .2s}
  .dots i.on{background:var(--gold);transform:scale(1.15)}
  .coach{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:5;
    width:min(340px,calc(100vw - 24px));padding:13px 15px;text-align:center;font-size:.92rem;line-height:1.4;
    animation:coachIn .3s ease both;word-break:break-word;overflow-wrap:anywhere}
  @keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  .coach .k{font-size:1.1rem}
  @media(max-width:400px){.coach{top:42px;padding:11px 13px;font-size:.85rem;line-height:1.35}}
  @media(max-width:340px){.coach{font-size:.8rem}}
  #bottom{padding-top:4px;background:linear-gradient(180deg,transparent,rgba(8,14,24,.55))}
  #actions{display:flex;gap:12px;justify-content:center;padding:6px 14px calc(12px + env(safe-area-inset-bottom))}
  #modal{position:fixed;inset:0;background:rgba(8,14,24,.82);backdrop-filter:blur(7px);display:none;
    place-items:center;padding:20px;z-index:60}
  #modal.open{display:grid}
  #modal>.panel{animation:pop .28s cubic-bezier(.2,1.4,.5,1) both}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  .cube{width:26px;height:26px;border-radius:5px;background:linear-gradient(180deg,#fff,#e6e9ef);
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.3);animation:hop .3s both}
  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  #confetti span{position:absolute;top:-20px;font-size:1.4rem;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:.9}}
  /* ── cooking sparkle when food lands ── */
  .spark{position:fixed;z-index:66;pointer-events:none;font-size:1.3rem;animation:spark .6s ease-out forwards}
  @keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1.1)}}
  /* ── feeding cutscene ── */
  .feast{position:fixed;inset:0;z-index:75;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%, rgba(24,36,60,.86), rgba(8,14,24,.94));backdrop-filter:blur(5px);animation:fade .3s both}
  .feast-scene{position:relative;text-align:center;z-index:76}
  .feast-gif{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(70vw,300px);opacity:.28;
    border-radius:20px;z-index:75;pointer-events:none;filter:saturate(1.1)}
  .friend{font-size:5.2rem;display:inline-block;transition:transform .16s;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
  .friend.chomp{transform:scale(1.2) rotate(-3deg)}
  .friend.happy{animation:feastBounce .7s ease}
  @keyframes feastBounce{0%,100%{transform:translateY(0) scale(1)}28%{transform:translateY(-26px) scale(1.12)}60%{transform:translateY(0) scale(1.06)}}
  .feast-cap{margin-top:14px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.5rem;color:var(--gold);
    filter:drop-shadow(0 2px 8px rgba(233,200,119,.4))}
  .feast-sub{margin-top:2px;color:var(--chalk-dim);font-size:.95rem}
  .feast-food{position:fixed;left:50%;bottom:13%;width:66px;height:66px;transform:translateX(-50%);z-index:78;
    transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .5s}
  .feast-food.go{transform:translate(-50%,-42vh) scale(.32) rotate(18deg);opacity:.15}
  .heart{position:fixed;left:50%;top:40%;font-size:1.7rem;z-index:79;pointer-events:none;animation:heartUp 1s ease forwards}
  @keyframes heartUp{0%{opacity:1;transform:translate(-50%,0) scale(.5)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-110px) scale(1.25)}}
  .steam{position:fixed;z-index:78;pointer-events:none;font-size:1.2rem;opacity:.7;animation:steam 1s ease-out forwards}
  @keyframes steam{0%{opacity:0;transform:translate(-50%,0) scale(.6)}30%{opacity:.7}100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}
  /* desktop: bigger plate, comfy shelf */
  @media(min-width:1024px){
    .plate{width:min(52vh,520px)}
    #shelf{justify-content:center;flex-wrap:wrap;max-height:200px;overflow-y:auto}
    .center{gap:22px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
    #sprout,#stars i{animation:none!important}}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="top" hidden>
    <div id="brief" class="brief" hidden></div>
    <button id="b-speak" class="icon-btn" aria-label="Read aloud" hidden>🔊</button>
    <button id="b-mute" class="icon-btn" aria-label="Sound on or off">🔇</button>
    <button id="b-myth" class="icon-btn" aria-label="Myth cards">💡</button>
    <button id="b-set" class="icon-btn" aria-label="Settings">⚙</button>
    <button id="b-about" class="icon-btn" aria-label="About">ⓘ</button>
  </div>
  <div id="screen" class="screen"></div>
  <div id="bottom" hidden>
    <div id="shelf" role="group" aria-label="Foods you can add"></div>
    <div id="actions"></div>
  </div>
</div>
<p id="live" class="sr-only" aria-live="polite"></p>

function foodVisual(def){

const GROUP_LABEL={veg:'Vegetable',fruit:'Fruit',grain:'Grain / carbohydrate',protein:'Protein food',dairy:'Dairy / drink',sometimes:'Sometimes food'};
/* Portion (hand guide) + nutrients — general education, verify with local guidance. */
const PORTION={veg:'About a fist (~80g)',fruit:'One handful / one piece (~80g)',grain:'A cupped hand (~40–60g cooked)',
  protein:'A palm (~100g)',dairy:'A small glass or matchbox (~150ml / 30g)',sometimes:'A small amount, now and then'};
const NUTRI_LBL={iron:'Iron',calcium:'Calcium','vitamin-c':'Vitamin C','vitamin-d':'Vitamin D','beta-carotene':'Vitamin A',
  wholegrain:'Slow-release energy','slow-release':'Slow-release energy','healthy-fat':'Healthy fats',
  'plant-protein':'Plant protein','omega-3':'Omega-3',potassium:'Potassium',antioxidant:'Antioxidants',energy:'Energy (carbs)',fibre:'Fibre'};
function portionText(def){ if(def.serve)return def.serve;
  if((def.tags||[]).includes('water'))return 'A glass whenever you are thirsty';
  return PORTION[def.group]||'A small serving'; }
function nutrientText(def){
  const out=[], add=t=>{ if(t&&!out.includes(t))out.push(t); };
  (def.tags||[]).forEach(t=>{ if(NUTRI_LBL[t])add(NUTRI_LBL[t]); });
  if(def.group==='sometimes') return ['High in free sugar / a treat'];
  if(def.produce) add('Vitamins');
  if(def.group==='protein') add('Protein');
  if(def.group==='dairy') add('Calcium');
  if((def.fibreG||0)>=3) add('Fibre');
  if(def.group==='grain'&&!out.includes('Slow-release energy')) add('Energy (carbs)');
  return out.slice(0,4);
}

/* ═══ SCORING ═══ */
const NUTRI={ target:{veg:.30,fruit:.20,grain:.25,protein:.20,dairy:.05},
  W:{balance:40,variety:20,fibre:15,sugar:15,hydration:10},
  tsp:4, sugarCap:{kid:5,teen:7,adult:7}, fibreTarget:{kid:6,teen:9,adult:10} };
function goalBonus(items,goal){ if(!goal)return 0;
  const has=t=>items.some(i=>(FOOD[i.id].tags||[]).includes(t)), grp=g=>items.some(i=>FOOD[i.id].group===g);
  const m={ sport:()=>(grp('grain')?4:0)+(grp('protein')?4:0)+(has('water')||grp('dairy')?2:0),
    focus:()=>(has('slow-release')||has('wholegrain')?4:0)+(grp('protein')?4:0)+(has('water')?2:0),
    growth:()=>(has('iron')?5:0)+(grp('protein')?3:0)+(grp('dairy')?2:0) };
  return Math.min(10,m[goal]?m[goal]():0);
}
function score(items,ctx){
  const W=NUTRI.W, tot=items.reduce((s,i)=>s+(FOOD[i.id].portions||0),0)||1, actual={};
  for(const g in NUTRI.target) actual[g]=0;
  items.forEach(i=>{const g=FOOD[i.id].group; if(actual[g]!==undefined)actual[g]+=FOOD[i.id].portions;});
  let dev=0; for(const g in NUTRI.target) dev+=Math.abs(actual[g]/tot-NUTRI.target[g]);
  const balance=clamp01(1-dev/1.4);
  const cols=new Set(items.filter(i=>FOOD[i.id].produce).map(i=>FOOD[i.id].colour));
  const variety=clamp01(cols.size/5);
  const fibre=clamp01(sum(items.map(i=>FOOD[i.id]),'fibreG')/NUTRI.fibreTarget[ctx.tier]);
  const tsp=sum(items.map(i=>FOOD[i.id]),'freeSugarG')/NUTRI.tsp, cap=NUTRI.sugarCap[ctx.tier];
  const sugar=tsp<=cap?1:clamp01(1-(tsp-cap)/(cap*1.5));
  const hyd=items.some(i=>(FOOD[i.id].tags||[]).includes('water'))?1:items.some(i=>(FOOD[i.id].tags||[]).includes('drink'))?.5:0;
  let s=balance*W.balance+variety*W.variety+fibre*W.fibre+sugar*W.sugar+hyd*W.hydration+goalBonus(items,ctx.goal);
  const present=Object.keys(actual).filter(g=>actual[g]>0);
  return {total:Math.round(clamp(s,0,100)),balance,variety,fibre,sugar,hyd,colours:cols.size,
    colourSet:cols,present,teaspoons:Math.round(tsp*10)/10,missing:Object.keys(actual).filter(g=>actual[g]===0)};
}
function coaching(r,lvl,items){
  const c=[], vals={balance:r.balance,variety:r.variety,fibre:r.fibre,hydration:r.hyd};
  const top=Object.entries(vals).sort((a,b)=>b[1]-a[1])[0][0];
  const low=Object.entries(vals).sort((a,b)=>a[1]-b[1])[0][0];
  const win={balance:'The shape of this plate is just right.',variety:`${r.colours} colours! That is the rainbow lesson in one plate.`,
    fibre:'Lots of fibre — this plate keeps you going.',hydration:'Water on the plate. Nicely done.'};
  c.push({t:'win',h:'You nailed it',b:win[top]||'A lovely varied plate.'});
  const nxt={variety:'Add another colour — something green or red.',fibre:'Add a wholegrain or some beans for fibre.',
    hydration:'Add a glass of water to finish it off.',balance:'Spread it across veg, grain and protein.'};
  if(r.missing.length) c.push({t:'next',h:'Try next',b:`No ${r.missing[0]} yet. One would round it out.`});
  else c.push({t:'next',h:'Try next',b:nxt[low]||'Small tweaks would push it higher.'});
  const facts=items.map(i=>FOOD[i.id]).filter(f=>f.fact);
  if(facts.length) c.push({t:'fact',h:'Good to know',b:facts[Math.floor(Math.random()*facts.length)].fact});
  return c.slice(0,3);
}

  $('#go').onclick=()=>{ const st=$('#stack');
    for(let i=0;i<cubes;i++) setTimeout(()=>{ if(st.isConnected){ st.append(el('div','cube')); beep(880-i*30,.05); } },i*80);
    setTimeout(()=>{ let m=`${cubes} spoons of sugar!`;

}

function beep(f=440,d=.1,type='sine',v=.12){ if(!State.sound)return; try{ actx=actx||new (AudioContext||webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;g.gain.value=.0001;
  o.connect(g).connect(actx.destination);o.start(); g.gain.exponentialRampToValueAtTime(v,actx.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d+.02);}catch{} }

const Screen=$('#screen'), Actions=$('#actions'), Shelf=$('#shelf'), Brief=$('#brief');
function show(s){ State.screen=s; document.body.classList.toggle('kid',State.aud==='kid');
  Screen.innerHTML=''; Actions.innerHTML=''; Shelf.innerHTML='';
  $('#top').hidden=(s==='title'); $('#bottom').hidden=!(s==='play');
  Brief.hidden=true; $('#b-speak').hidden=true;
  if(s==='title')return renderTitle();
  if(s==='hub')return renderHub();
  if(s==='play')return renderPlay();
  if(s==='week')return renderWeek();
  if(s==='garden')return renderGarden();
}
/* ═══ MEANING: intro story, purpose, why-it-matters ═══ */
const INTRO=[
 ['🪐','Welcome to Plate Planet','Every plate you build feeds a hungry little friend. A balanced plate gives them energy and a big smile — and teaches you what real balanced eating looks like.'],
 ['🌈','Watch the rainbow grow','Add different-coloured foods and the rainbow above the plate lights up. More colours means more vitamins. That is the whole idea — <b>eat the rainbow</b>.'],
 ['🌱','How to play','Tap foods to drop them on the plate. Fill the little goal shown at the top, then press <b>Feed</b>. Your friend reacts to how balanced the plate is — no numbers for kids, just colours and smiles.'],
 ['🍎','Why you are playing','This is not about "good" or "bad" food. It is about balance — a skill you keep. What you learn here works at your real table, for you and your family. No calorie counting, ever.']
];
function showIntro(){ let i=0;
  const render=()=>{ const [art,h,p]=INTRO[i];
    openModal(`<div class="intro"><div class="art">${art}</div><h3>${h}</h3><p>${p}</p>
      <div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="in-skip" style="flex:1;min-height:52px">Skip</button>
        <button class="btn" id="in-next" style="flex:1;min-height:52px">${i<INTRO.length-1?'Next →':"Let's cook 🍳"}</button></div></div>`);
    $('#in-skip').onclick=finish; $('#in-next').onclick=()=>{ if(i<INTRO.length-1){i++;render();} else finish(); };
  };
  const finish=()=>{ Save.seenIntro=1; flush(); closeModal(); };
  render();
}
const PURPOSE={
  kid:'Feed Sprout and learn what a balanced plate looks like — with colours, not numbers.',
  teen:'Build plates for real goals — sport, focus, energy — and see the hidden sugar in drinks.',
  adult:'Plan meals that balance nutrition, budget, time and taste, then export a shopping list.'
};
function whyText(l){ if(l.why)return l.why;
  if(State.aud==='kid') return 'Lots of colours means lots of different vitamins — to grow, play and feel good.';
  if(State.aud==='adult') return 'A balanced week beats a perfect single meal. Variety across the days is what really counts.';
  return ({sport:'Carbs fuel your muscles, protein repairs them, water replaces sweat — that is how you perform and recover.',
    focus:'Slow energy from wholegrains plus protein keeps your brain steady all morning — no 10:30 crash.',
    growth:'Iron, calcium and protein build a growing body — they matter most in your teens.',
    recover:'After training your body rebuilds with protein, colour and fluids.'}[l.goal]
    || 'Balanced plates give steady energy and everything your body needs, without any counting.'); }
function renderTitle(){
  const c=el('div','center');
  c.append(el('div','display',`<div style="font-size:2.7rem;text-align:center">🪐 <span class="gold-text">Plate Planet</span></div>
    <div class="subtitle">A friendly game where you build balanced plates for hungry friends — and learn what really fuels you.</div>`));
  const doors=el('div','doors');
  [['🌱','Sprout Kitchen','Ages 5–9','kid'],['⚡','Fuel Lab','Ages 10–17','teen'],['🍽️','Family Table','Grown-ups','adult']]
   .forEach(([g,n,s,a])=>{ const d=el('button','door',`<div class="g">${g}</div><div class="n">${n}</div><div class="s">${s}</div>`);
     d.onclick=()=>{State.aud=a; enableSoundOnce(); show('hub');}; doors.append(d); });
  c.append(doors);
  const row=el('div',null); row.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center';
  const how=el('button','btn btn-ghost','❓ How to play'); how.style.minHeight='48px'; how.onclick=showIntro;
  row.append(how, el('span',null,`<span style="color:var(--chalk-dim)">🌰 ${Save.seeds} seeds grown</span>`));
  c.append(row);
  Screen.append(c);
}
function renderHub(){
  const c=el('div','center'); c.style.justifyContent='flex-start'; c.style.gap='12px';
  c.append(el('div','display',`${({kid:'🌱 Sprout Kitchen',teen:'⚡ Fuel Lab',adult:'🍽️ Family Table'})[State.aud]}`));
  c.append(el('div','purpose',PURPOSE[State.aud]||''));
  const list=el('div',null); list.style.cssText='display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px';
  LEVELS[State.aud].forEach(l=>{ const done=Save.done.includes(l.id);
    const b=el('button','lvl',`<span class="ic">${l.ic}</span><span class="t"><b>${l.name}</b><br><span>${l.brief}</span></span>${done?'<span style="color:var(--veg);font-size:1.3rem">✓</span>':''}`);
    b.onclick=()=>startLevel(l); list.append(b); });
  c.append(list);
  const row=el('div',null,''); row.style.cssText='display:flex;gap:10px;margin-top:6px';
  const back=el('button','btn btn-ghost','← Modes'); back.onclick=()=>show('title');
  const g=el('button','btn','🌱 Garden'); g.onclick=()=>show('garden');
  row.append(back,g); c.append(row);
  Screen.append(c);
}
function startLevel(l){ State.level=l; State.plate=[]; State.revealed={};
  if(l.week){ show('week'); return; }
  show('play');
}
function renderPlay(){
  const l=State.level;
  Brief.hidden=false; Brief.innerHTML=`<span class="big">${l.ic}</span><span>${l.brief}</span>`;
  if(State.aud==='kid'){ $('#b-speak').hidden=false; $('#b-speak').onclick=()=>speak(l.speak||l.brief); speak(l.speak||l.brief); }
  // plate area
  const wrap=el('div','plate-wrap');
  wrap.innerHTML=rainbowSVG();
  const plate=el('div','plate'); plate.id='plate';
  wrap.append(plate);
  wrap.insertAdjacentHTML('beforeend','<div id="goal" hidden></div>');
  if(State.aud==='kid'){ const sprout=el('div',null,'🌱'); sprout.id='sprout'; wrap.append(sprout); }
  else { wrap.insertAdjacentHTML('beforeend',
    `<svg class="ring" id="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="#0d1626" stroke="#28374F" stroke-width="3"/>
     <circle id="ring-arc" cx="18" cy="18" r="15.5" fill="none" stroke="#37B26B" stroke-width="3" stroke-linecap="round"
       stroke-dasharray="97.4" stroke-dashoffset="97.4" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .4s,stroke .4s"/>
     <text id="ring-t" x="18" y="21" text-anchor="middle" font-size="10">0</text></svg>`); }
  Screen.append(wrap);
  // first-play coach: explain the pieces + the point
  if(!Save.coachDone){
    const msg=State.aud==='kid'
      ? `<span class="k">👋</span> Tap foods below to fill the plate. Watch the <b>🌈 rainbow</b> and <b>🌱 Sprout</b> light up. Reach the goal at the top, then press <b>Feed Sprout</b>.`
      : `<span class="k">👋</span> Tap foods to build the plate. The <b>🌈 rainbow</b> and the <b>score ring</b> show your balance. Hit the goal shown up top, then <b>Serve</b>.`;
    const coach=el('div','panel coach',`${msg}<div style="margin-top:10px"><button class="btn" style="min-height:44px;padding:8px 20px">Got it 👍</button></div>`);
    coach.querySelector('button').onclick=()=>{ Save.coachDone=1; flush(); coach.remove(); };
    wrap.append(coach);
  }
  // shelf
  l.food.forEach((id,idx)=>{ const def=FOOD[id]; if(!def)return;
    const b=el('button','food'); b.setAttribute('aria-label',`${def.name}, ${def.group}. Add to plate.`);
    if(State.aud==='kid'&&idx===0) b.classList.add('hint');
    const fv=foodVisual(def); b.append(fv);
    b.append(el('div','nm',def.name));
    const g=el('div','grp'); g.style.background=GTINT[def.group]||'#555'; b.append(g);
    const info=el('button','food-i','ⓘ'); info.type='button'; info.setAttribute('aria-label','About '+def.name+' — portion and nutrients');
    info.onclick=e=>{ e.stopPropagation(); foodInfo(def); }; b.append(info);
    b.onclick=()=>{ flyFood(b); addFood(id); };
    Shelf.append(b);
  });
  // actions
  const clear=el('button','btn btn-ghost','Clear'); clear.onclick=clearPlate;
  const serve=el('button','btn',{kid:'Feed Sprout 🌱',teen:'Serve it',adult:'Serve'}[State.aud]); serve.onclick=serveLevel;
  Actions.append(clear,serve);
  renderPlate();
}
function renderPlate(){
  const plate=$('#plate'); if(!plate)return;
  plate.innerHTML=''; plate.classList.toggle('empty',State.plate.length===0);
  plate.dataset.hint={kid:'Tap food to add it! 🍎',teen:'Tap foods to build your plate.',adult:'Tap foods to add.'}[State.aud];
  // auto-scale food tokens so any count fits inside the circle
  const n=State.plate.length;
  if(n){ const D=plate.clientWidth||320, gap=8, inner=D*0.64; // fit within the circle's inscribed square
    const cols=Math.max(1,Math.ceil(Math.sqrt(n))), rows=Math.max(1,Math.ceil(n/cols));
    let tok=Math.floor(Math.min((inner-gap*(cols-1))/cols,(inner-gap*(rows-1))/rows));
    tok=clamp(tok,30,State.aud==='kid'?92:80);
    plate.style.setProperty('--tok',tok+'px');
  }
  State.plate.forEach(p=>{ const def=FOOD[p.id];
    const d=el('div','placed'); d.append(foodVisual(def));
    const rm=el('button','rm','✕'); rm.setAttribute('aria-label','Remove '+def.name); rm.onclick=e=>{e.stopPropagation();removeFood(p.uid);};
    d.onclick=()=>{ document.querySelectorAll('.placed.show-rm').forEach(x=>x!==d&&x.classList.remove('show-rm')); d.classList.toggle('show-rm'); };
    d.append(rm); plate.append(d);
  });
  const r=score(State.plate,ctx());
  updateRainbow(r.colourSet);
  // live goal pill + ready glow
  const lvl=State.level, won=State.plate.length>0&&checkWin(lvl,r,State.plate);
  plate.classList.toggle('ready',won);
  const goal=$('#goal');
  if(goal){ const w=lvl.win||{}; let txt='';
    if(won) txt='Ready to serve! ✓';
    else if(w.colours) txt=`🌈 ${Math.min(r.colours,w.colours)}/${w.colours} colours`;
    else if(w.groups) txt=`🍽️ ${w.groups.filter(g=>r.present.includes(g)).length}/${w.groups.length} food groups`;
    else if(w.tag) txt='Pick the everyday drink 💧';
    else if(w.score) txt=`⚡ ${r.total}/${w.score}`;
    goal.hidden=!txt; goal.textContent=txt; goal.classList.toggle('met',won);
  }
  const sp=$('#sprout'); if(sp){ sp.textContent=SPROUT[Math.min(4,Math.floor(r.total/22))];
    sp.style.fontSize=(2.6+r.total/120)+'rem'; }
  const arc=$('#ring-arc'); if(arc){ const C=97.4, col=r.total>=70?'var(--veg)':r.total>=45?'var(--lamp)':'var(--fruit)';
    arc.style.strokeDashoffset=C*(1-r.total/100); arc.style.stroke=col; $('#ring-t').textContent=r.total; }
  // teen/parent live score in brief
  if(State.aud!=='kid'){ Brief.innerHTML=`<span class="big">${State.level.ic}</span>
    <span>${State.level.brief}<br><b style="font-family:monospace">${r.total}/100 · ${r.teaspoons} tsp sugar</b></span>`; }
}
function checkWin(l,r,items){ const w=l.win; if(!w)return true;
  if(w.score&&r.total<w.score)return false;
  if(w.colours&&r.colours<w.colours)return false;
  if(w.groups&&!w.groups.every(g=>r.present.includes(g)))return false;
  if(w.tag&&!items.some(i=>(FOOD[i.id].tags||[]).includes(w.tag)))return false;
  if(w.maxTsp!=null&&r.teaspoons>w.maxTsp)return false;
  return true;
}
function serveLevel(){
  const l=State.level, items=State.plate;
  if(!items.length){ live('Add some food first'); speak('Add some food first'); return; }
  const r=score(items,ctx()), won=checkWin(l,r,items);
  if(won){ if(!Save.done.includes(l.id))Save.done.push(l.id); Save.seeds+=2;
    if(!Save.plants.includes(l.id))Save.plants.push(l.id); }
  else Save.seeds+=1;
  flush(); vibrate(won?[20,40,30]:30);
  const cards=coaching(r,l,items);
  const proceed=()=>renderDebrief(l,r,items,won,cards);
  // cinematic: cook + feed the friend, then debrief
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) proceed();
  else feedAnimation(items, proceed);
}
function renderDebrief(l,r,items,won,cards){
  if(won) confetti(); else beep(392,.18,'sine',.09);
  $('#bottom').hidden=true; Brief.hidden=true; $('#b-speak').hidden=true;
  Screen.innerHTML='';
  const c=el('div','center'); c.style.justifyContent='flex-start';
  const head=State.aud==='kid'?'⭐'.repeat(Math.max(1,Math.round(r.total/22))):`${r.total}/100 · ${r.teaspoons} tsp sugar`;
  c.append(el('div','display',`<div style="font-size:2rem;text-align:center">${won?'🎉 '+({kid:'Yummy!',teen:'Served!',adult:'Planned!'})[State.aud]:'Good start!'}</div>
    <div style="text-align:center;font-size:1.6rem;margin-top:4px">${head}</div>
    <div style="text-align:center;color:var(--veg);margin-top:2px">🌰 +${won?2:1} seeds</div>`));
  const box=el('div',null); box.style.cssText='display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px';
  box.append(el('div','card why',`<b>💡 Why this matters</b><br><span style="color:var(--chalk-dim)">${whyText(l)}</span>`));
  cards.forEach(cd=>box.append(el('div','card '+cd.t,`<b>${cd.h}</b><br><span style="color:var(--chalk-dim)">${cd.b}</span>`)));
  c.append(box);
  if(State.aud==='kid') speak(won?'Yummy! '+cards[0].b:'Good start. '+cards[1].b);
  const row=el('div',null); row.style.cssText='display:flex;gap:10px;margin-top:8px';
  const again=el('button','btn btn-ghost',{kid:'Again',teen:'Rebuild',adult:'Adjust'}[State.aud]); again.onclick=()=>startLevel(l);
  const hub=el('button','btn','Home'); hub.onclick=()=>show('hub');
  row.append(again,hub); c.append(row);
  Screen.append(c);
}

/* ═══ FAMILY WEEK ═══ */
function weekStats(){ const chosen=Object.values(State.week).filter(Boolean).map(id=>MEALS.find(m=>m.id===id));
  if(!chosen.length)return null;
  const items=chosen.flatMap(m=>m.items.map(id=>({id}))), r=score(items,{tier:'adult'});
  return {balance:r.total,cost:chosen.reduce((s,m)=>s+m.cost,0)/chosen.length,
    time:chosen.reduce((s,m)=>s+m.prepMin,0)/chosen.length,acc:chosen.reduce((s,m)=>s+m.acceptance,0)/chosen.length,
    n:chosen.length,tsp:r.teaspoons}; }
function renderWeek(){
  const c=el('div','center'); c.style.justifyContent='flex-start';
  c.append(el('div','display','📅 Plan the week'));
  const g=el('div',null); g.style.cssText='display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{
    const sel=el('select','panel'); sel.style.cssText='padding:12px;width:100%;background:var(--ink-2);color:var(--chalk)';
    sel.innerHTML=`<option value="">${d} — pick a dinner</option>`+MEALS.map(m=>`<option value="${m.id}" ${State.week[d]===m.id?'selected':''}>${m.name}</option>`).join('');
    sel.onchange=()=>{State.week[d]=sel.value;drawDials();}; g.append(sel);
  });
  const dials=el('div','panel'); dials.id='dials'; dials.style.padding='16px'; g.append(dials);
  const exp=el('button','btn','📋 Export shopping list'); exp.onclick=exportList; g.append(exp);
  c.append(g);
  const back=el('button','btn btn-ghost','← Home'); back.onclick=()=>show('hub'); c.append(back);
  Screen.append(c); drawDials();
}
function drawDials(){ const d=$('#dials'); if(!d)return; const s=weekStats();
  if(!s){ d.innerHTML='<span style="color:var(--chalk-dim)">Pick dinners to see the week balance.</span>'; return; }
  const bar=(l,v,mx,inv,col)=>{ const pct=clamp(inv?1-v/mx:v/mx,0,1)*100;
    return `<div style="margin-bottom:10px"><div style="font-size:.9rem;margin-bottom:4px">${l}</div>
      <div class="meter"><i style="width:${pct}%;background:${col}"></i></div></div>`; };
  d.innerHTML=bar('Balance',s.balance,100,false,'var(--veg)')+bar('Budget (lower = cheaper)',s.cost,5,true,'var(--grain)')
    +bar('Time (lower = quicker)',s.time,40,true,'var(--dairy)')+bar('Acceptance',s.acc,5,false,'var(--joy)')
    +`<div style="color:var(--chalk-dim);font-size:.86rem">${s.n}/7 planned · about ${Math.round(s.tsp)} tsp sugar.</div>`;
  if(s.n===7){ if(!Save.done.includes('C1'))Save.done.push('C1'); if(!Save.plants.includes('C1'))Save.plants.push('C1'); Save.seeds+=3; flush(); }
}
function exportList(){ const chosen=Object.values(State.week).filter(Boolean).map(id=>MEALS.find(m=>m.id===id));
  if(!chosen.length){ openModal('<div style="text-align:center"><p>Plan some dinners first.</p><button class="btn" data-close>OK</button></div>'); return; }
  const cats={veg:[],fruit:[],grain:[],protein:[],dairy:[],sometimes:[]}, seen=new Set();
  chosen.flatMap(m=>m.items).forEach(id=>{ if(seen.has(id))return; seen.add(id); const f=FOOD[id]; (cats[f.group]||cats.sometimes).push(f.name); });
  let txt='PLATE PLANET — shopping list\n\n';
  for(const g in cats) if(cats[g].length) txt+=g.toUpperCase()+'\n'+cats[g].map(n=>'  - '+n).join('\n')+'\n\n';
  openModal(`<div><div class="display" style="font-size:1.2rem;margin-bottom:8px">Shopping list</div>
    <textarea readonly style="width:100%;height:200px;background:var(--ink);color:var(--chalk);border-radius:12px;border:2px solid var(--stall);padding:10px">${txt}</textarea>
    <div style="display:flex;gap:10px;margin-top:10px"><button id="cp" class="btn" style="flex:1">Copy</button>
    <button class="btn btn-ghost" style="flex:1" data-close>Close</button></div></div>`);
  $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(txt);$('#cp').textContent='Copied ✓';};
}

/* ═══ GARDEN ═══ */
function renderGarden(){
  const c=el('div','center');
  c.append(el('div','display','🌱 Your Garden'));
  c.append(el('div',null,`<span style="color:var(--chalk-dim)">🌰 ${Save.seeds} seeds · ${Save.plants.length} plants grown</span>`));
  const grid=el('div',null); grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-size:2.6rem';
  const gl=['🌻','🌷','🍅','🥕','🌸','🌵','🍇','🥬'];
  Save.plants.forEach((p,i)=>grid.append(el('div',null,gl[i%gl.length])));
  for(let i=Save.plants.length;i<8;i++) grid.append(el('div',null,'<span style="opacity:.25">🌰</span>'));
  c.append(grid);
  if(Save.done.some(d=>d[0]==='A')&&Save.done.some(d=>d[0]==='B')&&Save.done.includes('C1'))
    c.append(el('div',null,'<div style="font-size:2.4rem">🏡 Greenhouse open!</div>'));
  const back=el('button','btn btn-ghost','← Home'); back.onclick=()=>show('hub'); c.append(back);
  Screen.append(c);
}

/* ═══ MODALS ═══ */
function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="panel" style="padding:22px;max-width:400px;width:100%;max-height:88vh;overflow:auto">${html}</div>`;
  m.classList.add('open'); m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.onclick=e=>{if(e.target===m)closeModal();}; }
function closeModal(){ const m=$('#modal'); m.classList.remove('open'); m.innerHTML=''; }

/* ═══ MYTH DECK ═══ */
let myth=0;
function openMyth(){ myth=0; renderMyth(); }
function renderMyth(){ const [claim,ans,expl]=MYTHS[myth];
  openModal(`<div style="text-align:center">
    <div style="color:var(--chalk-dim);font-size:.8rem;margin-bottom:8px">Myth ${myth+1}/${MYTHS.length}</div>
    <div class="display" style="font-size:1.15rem;margin-bottom:16px">${claim}</div>
    <div id="mb"><div style="display:flex;gap:10px"><button id="mt" class="btn btn-ghost" style="flex:1">True</button>
    <button id="mf" class="btn btn-ghost" style="flex:1">Not quite</button></div></div>
    <button class="btn btn-ghost" style="margin-top:14px" data-close>Close deck</button></div>`);
  const rev=g=>{ $('#mb').innerHTML=`<div class="card ${g===ans?'win':'next'}" style="margin-bottom:12px">
    <b>${g===ans?'You got it.':'Have another look.'}</b><br><span style="color:var(--chalk-dim)">${expl}</span></div>
    <button id="mn" class="btn" style="width:100%">${myth<MYTHS.length-1?'Next':'Done'}</button>`;
    beep(660,.15,'sine',.08); $('#mn').onclick=()=>{ if(myth<MYTHS.length-1){myth++;renderMyth();}else closeModal(); }; };
  $('#mt').onclick=()=>rev(true); $('#mf').onclick=()=>rev(false);
}

  <label style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">Sound &amp; spoken words
    <input id="s-snd" type="checkbox" ${State.sound?'checked':''} style="width:22px;height:22px"></label>
  <label style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">Bigger text
    <input id="s-txt" type="checkbox" style="width:22px;height:22px"></label>
  <button id="s-erase" class="btn btn-ghost" style="width:100%;margin-bottom:10px">Erase everything</button>
  <button class="btn" style="width:100%" data-close>Done</button></div>`);
  $('#s-snd').onchange=e=>toggleSound(e.target.checked);
  $('#s-txt').onchange=e=>document.documentElement.style.setProperty('--txt',e.target.checked?'1.2':'1');
  $('#s-erase').onclick=()=>{ try{localStorage.removeItem(KEY);}catch{} location.reload(); };
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
// first tap anywhere enables audio context resume
document.addEventListener('pointerdown',()=>{ if(actx&&actx.state==='suspended')actx.resume(); },{once:false});

/* ═══ BOOT ═══ */
makeStars(); refreshMute();
show('title');
if(!Save.seenIntro) setTimeout(showIntro, 400);   // first-run story: what + why + how
</script>
</body>
</html>
