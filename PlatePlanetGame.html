<!DOCTYPE html>
<html lang="en">
<!--
  ════════════════════════════════════════════════════════════════════════
  PLATE PLANET — build a balanced plate
  Single-file 3D nutrition game (kids / teens / parents).
  ────────────────────────────────────────────────────────────────────────
  DEPENDENCIES (pinned):
    three     0.169.0  (import map, unpkg)
    Tailwind  Play CDN (dev). PROD: run Tailwind CLI once, paste generated
              CSS inline, delete the CDN <script>.
    fonts     Bricolage Grotesque / Public Sans / IBM Plex Mono (Google)
  ────────────────────────────────────────────────────────────────────────
  COLOUR TOKENS: window.TOKENS + :root vars — single source shared by
    Tailwind config and Three.js materials. Never diverge them.
  ────────────────────────────────────────────────────────────────────────
  SCRIPT SECTION MAP (search the banner to jump):
    01 CONFIG      07 AUDIO       13 MODES
    02 DATA        08 FACTORY     14 MINIGAMES
    03 UTIL        09 SCENE       15 UI
    04 CAPABILITY  10 AURORA      16 GARDEN
    05 STORE       11 INPUT       17 FALLBACK
    06 PERSIST     12 SCORE       18 BOOT
  ────────────────────────────────────────────────────────────────────────
  SAFETY: no calories anywhere; no body-size/weight; no moralising words
    (banned list enforced in copy); no fail state in kids mode.
  NOTE: FOOD_DB / NUTRI_MODEL are placeholders — require dietitian sign-off
    and sourced national food-composition values before public release.
  ════════════════════════════════════════════════════════════════════════
-->

<title>Plate Planet — build a balanced plate</title>
<meta name="description" content="A 3D game about balanced plates for kids, teens and parents.">

<script src="https://cdn.tailwindcss.com"></script>

    colors: TOKENS,

      display: ['"Bricolage Grotesque"','system-ui','sans-serif'],

<style>
  :root{

    --veg:#2E9E5B; --fruit:#C3305F; --grain:#D9932F; --protein:#6A5AC9;
    --dairy:#4FB8D4; --sometimes:#8A93A3; --water:#2BB3C0; --sugar-haze:#E8A33C;

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--ink);color:var(--chalk);

    font-size:calc(16px * var(--txt-scale)); -webkit-text-size-adjust:100%}
  #canvas-root{position:fixed;inset:0;touch-action:none;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;
      height:100dvh;display:flex;flex-direction:column;justify-content:space-between}
  #ui > *{pointer-events:auto}
  #stage-ui{pointer-events:none}
  .btn{min-height:56px;min-width:56px;border-radius:16px;border:0;cursor:pointer;
       font:600 1.05rem/1 "Public Sans",system-ui,sans-serif;color:var(--ink);
       background:var(--lamp);padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:translateY(1px)}
  .btn-ghost{background:var(--ink-2);color:var(--chalk);border:1px solid var(--stall)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:focus-visible,[data-focus]:focus-visible,.food-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
  .chip{background:var(--ink-2);border:1px solid var(--stall);border-radius:999px;
        padding:8px 16px;font-weight:600;font-size:.95rem;max-width:70vw}
  .icon-btn{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;
        background:var(--ink-2);border:1px solid var(--stall);color:var(--chalk);cursor:pointer;font-size:1.2rem}
  .panel{background:var(--ink-2);border:1px solid var(--stall);border-radius:20px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
           clip-path:inset(50%);white-space:nowrap;border:0}
  #primary-action{padding:10px 16px calc(14px + var(--pad-b))}
  #hud{padding:12px}
  #food-rail{scrollbar-width:thin}

  .food-btn{flex:0 0 auto;min-width:78px;min-height:92px;border-radius:16px;cursor:pointer;

        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}

  .food-btn .nm{font-size:.78rem;text-align:center;line-height:1.05}

  .kid{--txt-scale:1.06}

       display:none;place-items:center;padding:20px;z-index:40}

  #boot-msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:50}
  #fallback{position:fixed;inset:0;overflow:auto;padding:20px;background:var(--ink);z-index:30}

  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .plated{position:absolute;bottom:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
          padding:8px;pointer-events:auto}
  .p-chip{background:var(--ink-2);border:1px solid var(--stall);border-radius:999px;padding:5px 10px;
          font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:6px}
  .p-chip .x{opacity:.6}
  .cube{width:22px;height:22px;border-radius:4px;background:var(--chalk);

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

</head>

const Audio = (() => {
  let ctx=null;
  const pitch={ veg:220, fruit:277, grain:330, protein:392, dairy:494, sometimes:180 };
  function ensure(){ if(!ctx && !Store.state.muted) ctx=new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(freq,type='triangle',dur=0.12,vol=0.15){
    const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=0.0001;
    o.connect(g).connect(c.destination); o.start();
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.stop(c.currentTime+dur+0.02);
  }
  function blip(group){ tone(pitch[group]||300); }
  function arpeggio(){ [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.18,0.12),i*90)); }
  function soft(){ [330,392,440].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.16,0.08),i*80)); }
  function cube(i){ tone(1200 - i*40,'square',0.05,0.08); }
  return { blip, arpeggio, soft, cube, ensure, suspend(){ctx&&ctx.suspend();}, resume(){ctx&&ctx.resume();} };
})();

const geoCache=new Map();
function labelTexture(name){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
  const x=cv.getContext('2d');
  x.fillStyle='#EDE6D6'; x.fillRect(0,0,128,128);
  x.fillStyle='#C3305F'; x.fillRect(0,20,128,26);
  x.fillStyle='#EDE6D6'; x.font='bold 13px sans-serif'; x.textAlign='center';
  x.fillText(name.slice(0,10), 64, 38);
  x.fillStyle='#101B2E'; x.font='9px monospace';
  x.fillText('per 100g', 64, 66); x.fillText('read the back', 64, 86);
  return new CanvasTexture(cv);
}
const ARCH = {
  sphere:()=>{ const g=new IcosahedronGeometry(0.3,1); g.scale(1,0.9,1); return g; },
  taper:()=>{ const p=[[0,0.9],[0.12,0.55],[0.16,0],[0.1,-0.6],[0,-0.95]].map(([x,y])=>new Vector2(x,y));
    const g=new LatheGeometry(p,10); g.scale(0.55,0.55,0.55); g.computeVertexNormals(); return g; },
  slab:()=>{ const g=new BoxGeometry(0.5,0.18,0.34); return g; }
};
function buildFood(def){
  const mat=new MeshStandardMaterial({ color:def.tint, roughness:0.6, metalness:0,
    flatShading:!!def.produce, emissive:def.produce?def.tint:0x000000,
    emissiveIntensity:def.produce?0.09:0 });
  let node;
  if(def.archetype==='cluster'){
    node=new Group();
    const stem=new Mesh(new CylinderGeometry(0.04,0.05,0.34,6), new MeshStandardMaterial({color:0x5A7A38,roughness:0.7}));
    stem.position.y=-0.14; node.add(stem);
    for(let i=0;i<6;i++){ const h=new Mesh(new IcosahedronGeometry(0.13,0),mat);
      const a=(i/6)*Math.PI*2; h.position.set(Math.cos(a)*0.13,0.14+Math.random()*0.05,Math.sin(a)*0.13); node.add(h); }
  } else if(def.archetype==='leaf'){
    node=new Group();
    for(let i=0;i<5;i++){ const lf=new Mesh(new IcosahedronGeometry(0.16,0),mat);
      lf.scale.set(1.3,0.25,0.8); lf.rotation.y=i*1.2; lf.position.set(Math.cos(i*1.2)*0.1,i*0.03,Math.sin(i*1.2)*0.1); node.add(lf); }
  } else if(def.archetype==='grain'){
    node=new Group();
    const bowl=new Mesh(new CylinderGeometry(0.32,0.24,0.14,16), new MeshStandardMaterial({color:0x21344E,roughness:0.5}));
    node.add(bowl);
    for(let i=0;i<40;i++){ const gr=new Mesh(new SphereGeometry(0.035,5,4),mat);
      gr.position.set((Math.random()-0.5)*0.5,0.08+Math.random()*0.04,(Math.random()-0.5)*0.5); node.add(gr); }
  } else if(def.archetype==='vessel'){
    node=new Group();
    const bodyMat=new MeshStandardMaterial({color:def.tint,roughness:0.3,metalness:0.1,transparent:true,opacity:0.55});
    const body=new Mesh(new CylinderGeometry(0.2,0.17,0.6,16),bodyMat); node.add(body);
    if(def.liquid!=null){ const liq=new Mesh(new CylinderGeometry(0.17,0.15,0.5,16),
      new MeshStandardMaterial({color:def.liquid,roughness:0.2})); liq.position.y=-0.03; node.add(liq); }
  } else if(def.archetype==='pack'){
    node=new Mesh(new BoxGeometry(0.34,0.5,0.14),
      new MeshStandardMaterial({map:labelTexture(def.name),roughness:0.7}));
  } else {
    const k=def.archetype;
    if(!geoCache.has(k)) geoCache.set(k, ARCH[def.archetype]());
    node=new Mesh(geoCache.get(k),mat);
  }
  node.userData={ foodId:def.id, group:def.group, home:null, grabbable:true };
  node.traverse(o=>{ if(o.isMesh) o.layers.enable(CONFIG.LAYER_INTERACTIVE); });
  node.layers.enable(CONFIG.LAYER_INTERACTIVE);
  return node;
}

/* ══ 10 AURORA ═════════════════════════════════════════════════════════ */
const Aurora = (() => {
  let group, base, arcs=[], shimmer, haze, underglow;
  const target={ bands:0, variety:0, fibre:0, sugar:0, hydration:0 };
  const cur   ={ bands:0, variety:0, fibre:0, sugar:0, hydration:0 };
  const groupOrder=['veg','fruit','grain','protein','dairy'];

  function hazeSprite(){
    const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
    const g=cv.getContext('2d').createRadialGradient(64,64,4,64,64,64);
    g.addColorStop(0,'rgba(232,163,60,0.9)'); g.addColorStop(1,'rgba(232,163,60,0)');
    const x=cv.getContext('2d'); x.fillStyle=g; x.fillRect(0,0,128,128);
    return new CanvasTexture(cv);
  }
  function init(parent){
    group=new Group(); group.position.y=0.2; parent.add(group);
    base=new Mesh(new RingGeometry(0.4,1.25,48),
      new MeshBasicMaterial({color:TOKENS.stall,transparent:true,opacity:0.15,side:DoubleSide,blending:AdditiveBlending}));
    base.rotation.x=-Math.PI/2; base.position.y=0.1; group.add(base);
    groupOrder.forEach((g,i)=>{
      const m=new Mesh(new CylinderGeometry(0.06,0.06,0.02,8),
        new MeshBasicMaterial({color:GROUP_TINT[g],transparent:true,opacity:0.85,blending:AdditiveBlending}));
      m.userData.group=g; arcs.push(m); group.add(m);
    });
    const geo=new BufferGeometry(); const N=200; const pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const a=Math.random()*Math.PI*2, r=0.3+Math.random()*0.9;
      pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*1.2; pos[i*3+2]=Math.sin(a)*r; }
    geo.setAttribute('position',new BufferAttribute(pos,3));
    shimmer=new Points(geo,new PointsMaterial({color:TOKENS.chalk,size:0.03,transparent:true,opacity:0,blending:AdditiveBlending}));
    group.add(shimmer);
    haze=new Sprite(new SpriteMaterial({map:hazeSprite(),transparent:true,opacity:0,blending:AdditiveBlending,depthWrite:false}));
    haze.scale.set(2,2,1); haze.position.y=0.4; group.add(haze);
    underglow=new Mesh(new CircleGeometry(1.3,40),
      new MeshBasicMaterial({color:TOKENS.water,transparent:true,opacity:0,side:DoubleSide,blending:AdditiveBlending}));
    underglow.rotation.x=-Math.PI/2; underglow.position.y=-0.08; plateGroup.add(underglow);
  }
  function setChannels(ch, groupsPresent){
    target.bands=ch.groupsCount/5; target.variety=ch.variety; target.fibre=ch.fibre;
    target.sugar=ch.sugar_amt; target.hydration=ch.hydration; Aurora._present=groupsPresent;
  }
  function reset(){ target.bands=target.variety=target.fibre=target.sugar=target.hydration=0; }
  function update(t){
    if(!group) return;
    for(const k in cur) cur[k]=lerp(cur[k],target[k], CONFIG.reducedMotion?1:0.12);
    arcs.forEach((m,i)=>{
      const on=Aurora._present?Aurora._present.includes(m.userData.group):false;
      const h=on?(0.35+cur.fibre*0.9):0.02;
      m.scale.y=h; const radius=0.55+i*0.13;
      const ang=(i/5)*Math.PI*2 + (t||0)*0.0002;
      m.position.set(Math.cos(ang)*radius, 0.1+h*0.5, Math.sin(ang)*radius);
      m.material.opacity=on?0.85:0.06;
    });
    shimmer.material.opacity=cur.fibre*0.7;
    shimmer.rotation.y=(t||0)*0.0001;
    const sp=shimmer.geometry.attributes.position;
    if(!CONFIG.reducedMotion){ for(let i=0;i<sp.count;i++){ let y=sp.getY(i)+0.004; if(y>1.2)y=0; sp.setY(i,y);} sp.needsUpdate=true; }
    haze.material.opacity=cur.sugar*0.6; haze.scale.setScalar(1.4+cur.sugar*1.4);
    underglow.material.opacity=cur.hydration*0.4;
  }
  return { init, setChannels, reset, update };
})();

/* ══ 11 INPUT ══════════════════════════════════════════════════════════ */
const ray=new Raycaster(); ray.layers.set(CONFIG.LAYER_INTERACTIVE);
const dragPlane=new Plane(); const ptr=new Vector2();
let held=null, downAt=0, downPos=new Vector2(), lpTimer=null, orbitLast=null, movedFar=false;

function toNDC(e){ const r=canvas.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); }
function topFood(o){ while(o&&!o.userData?.grabbable) o=o.parent; return o; }

canvas.addEventListener('pointerdown',e=>{
  if(Store.state.screen!=='play') return;
  toNDC(e); downAt=performance.now(); downPos.set(e.clientX,e.clientY); movedFar=false;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(marketRing.children,true)[0];
  if(hit){ held=topFood(hit.object); canvas.setPointerCapture(e.pointerId);
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new Vector3()).negate(), held.position);
    Audio.blip(held.userData.group);
    lpTimer=setTimeout(()=>{ if(held) showFoodCard(held.userData.foodId); },450);
  } else { orbit.dragging=true; orbitLast=e.clientX; }
},{passive:true});

canvas.addEventListener('pointermove',e=>{
  if(orbit.dragging&&orbitLast!=null){ const dx=e.clientX-orbitLast; orbitLast=e.clientX;
    orbit.vel=dx*0.0016; orbit.angle=clamp(orbit.angle+dx*0.0016,-CONFIG.orbitClampRad,CONFIG.orbitClampRad); return; }
  if(!held) return;
  if(downPos.distanceTo(new Vector2(e.clientX,e.clientY))>8){ movedFar=true; clearTimeout(lpTimer); }
  toNDC(e); ray.setFromCamera(ptr,camera);
  const p=new Vector3(); if(ray.ray.intersectPlane(dragPlane,p)) held.position.lerp(p,0.35);
},{passive:true});

canvas.addEventListener('pointerup',e=>{
  clearTimeout(lpTimer);
  if(orbit.dragging){ orbit.dragging=false; orbitLast=null; return; }
  if(!held) return;
  const tap=performance.now()-downAt<250 && !movedFar;
  if(tap){ if(Store.state.tapToPlace) addToPlate(held.userData.foodId); else showFoodCard(held.userData.foodId); }
  else {
    // dropped near plate centre → add
    if(held.position.length()<1.6) addToPlate(held.userData.foodId);
    held.position.copy(held.userData.home);
  }
  held=null;
},{passive:true});

function goalBonus(items, goal){
  if(!goal) return 0;
  const has=t=>items.some(i=>(FOOD[i.id].tags||[]).includes(t));
  const grp=g=>items.some(i=>FOOD[i.id].group===g);
  const map={
    sport:()=>(grp('grain')?4:0)+(grp('protein')?4:0)+(has('water')||grp('dairy')?2:0),
    focus:()=>(has('slow-release')||has('wholegrain')?4:0)+(grp('protein')?4:0)+(has('water')?2:0),
    growth:()=>(has('iron')?4:0)+(has('calcium')||grp('dairy')?3:0)+(grp('protein')?3:0),
    recover:()=>(grp('protein')?4:0)+(grp('fruit')||grp('veg')?4:0)+(has('water')?2:0)
  };
  return Math.min(10, (map[goal]?map[goal]():0));
}
function scorePlate(items, ctx){
  const W=NUTRI_MODEL.weights;
  const total=items.reduce((s,i)=>s+(FOOD[i.id].portions||0),0)||1;
  const actual={}; for(const g of Object.keys(NUTRI_MODEL.targetProportions)) actual[g]=0;
  items.forEach(i=>{ const g=FOOD[i.id].group; if(actual[g]!==undefined) actual[g]+=FOOD[i.id].portions; });
  let dev=0; for(const [g,t] of Object.entries(NUTRI_MODEL.targetProportions)) dev+=Math.abs(actual[g]/total - t);
  const balance=clamp01(1 - dev/1.4);
  const colours=new Set(items.filter(i=>FOOD[i.id].produce).map(i=>FOOD[i.id].colour));
  const variety=clamp01(colours.size/5);
  const fibre=clamp01(sum(items.map(i=>FOOD[i.id]),'fibreG')/NUTRI_MODEL.fibreTargetG[ctx.tier]);
  const tsp=sum(items.map(i=>FOOD[i.id]),'freeSugarG')/NUTRI_MODEL.freeSugarTeaspoonGrams;
  const cap=NUTRI_MODEL.sugarSoftCapTsp[ctx.tier];
  const sugar= tsp<=cap ? 1 : clamp01(1-(tsp-cap)/(cap*1.5));
  const hydration=items.some(i=>(FOOD[i.id].tags||[]).includes('water'))?1
    : items.some(i=>(FOOD[i.id].tags||[]).includes('drink'))?0.5:0;
  let score=balance*W.balance+variety*W.variety+fibre*W.fibre+sugar*W.sugar+hydration*W.hydration;
  score+=goalBonus(items,ctx.goal);
  const present=Object.keys(actual).filter(g=>actual[g]>0);
  return {
    total:Math.round(clamp(score,0,100)),
    channels:{ balance,variety,fibre,sugar,hydration,
      groupsCount:present.length, colours:colours.size, sugar_amt:clamp01(tsp/(cap*2)) },
    present, teaspoons:Math.round(tsp*10)/10,
    missing:Object.keys(actual).filter(g=>actual[g]===0)
  };
}
function coachingCards(res, level, items){
  const ch=res.channels, cards=[];
  const names={balance:'balance',variety:'colour',fibre:'fibre',sugar:'sugar',hydration:'water'};
  const chanVals={ balance:ch.balance, variety:ch.variety, fibre:ch.fibre, hydration:ch.hydration };
  const top=Object.entries(chanVals).sort((a,b)=>b[1]-a[1])[0];
  const low=Object.entries(chanVals).sort((a,b)=>a[1]-b[1])[0];
  const winTxt={ balance:'The shape of this plate is spot on.', variety:`${ch.colours} colours on one plate. That is the rainbow lesson in one go.`,
    fibre:'Plenty of fibre here — this plate will keep you going.', hydration:'Water on the plate. That is the default done right.' };
  cards.push({t:'win', h:'Nailed it', b:winTxt[top[0]]||'A varied plate — nicely done.'});
  const nextTxt={
    variety:'Add another colour. A handful of something green or red would widen the rainbow.',
    fibre:'Light on fibre. A wholegrain or some beans would add it.',
    hydration:'No water yet. Add a glass and the plate is complete.',
    balance:'One group is doing the heavy lifting. Spread it across veg, grain and protein.'
  };
  if(res.missing.length){ const g=res.missing[0];
    cards.push({t:'next', h:'Try next', b:`No ${g} yet. Adding one would round out the plate.`}); }
  else cards.push({t:'next', h:'Try next', b:nextTxt[low[0]]||'Small tweaks would push this higher.'});
  const placed=items.map(i=>FOOD[i.id]).filter(f=>f.fact);
  if(placed.length) cards.push({t:'fact', h:'Good to know', b:placed[Math.floor(Math.random()*placed.length)].fact});
  return cards.slice(0,3);
}

function currentCtx(){ const l=Store.state.level; return { tier:Store.state.aud, goal:l&&l.goal }; }
function recompute(){
  const items=Store.state.plate;
  const res=scorePlate(items,currentCtx());
  Aurora.setChannels(res.channels, res.present);
  UI.updateChannels(res);
  return res;
}
function addToPlate(id){
  const def=FOOD[id]; if(!def) return;
  if(def.tags && def.tags.includes('reveal') && def.freeSugarG>0 && !Store.state._revealed?.[id]){
    SugarReveal.show(def, ()=>reallyAdd(id));
    return;
  }
  reallyAdd(id);
}
function reallyAdd(id){
  const def=FOOD[id];
  Store.state.plate.push({ id, uid:Math.random().toString(36).slice(2) });
  const m=buildFood(def); platedGroup.add(m); layoutPlated();
  Audio.blip(def.group);
  liveSay(`${def.name} added.`);
  recompute(); UI.renderPlated();
}
function removeFromPlate(uid){
  const idx=Store.state.plate.findIndex(p=>p.uid===uid); if(idx<0) return;
  Store.state.plate.splice(idx,1);
  const m=platedGroup.children[idx]; if(m) platedGroup.remove(m);
  layoutPlated(); recompute(); UI.renderPlated();
}
function clearPlate(){
  Store.state.plate.length=0;
  [...platedGroup.children].forEach(c=>platedGroup.remove(c));
  Aurora.reset(); recompute(); UI.renderPlated();
}
function liveSay(t){ $('#a11y-live').textContent=t; }

const SugarReveal = (() => {
  function show(def, done){
    const cubes=Math.round(def.freeSugarG/4);
    let guessHtml = Store.state.aud!=='kid'
      ? `<div class="mb-3"><label class="text-sm" style="color:var(--chalk-dim)">Guess the teaspoons first:</label>
         <input id="sugar-guess" type="range" min="0" max="12" value="4" class="w-full"></div>
         <button id="reveal-go" class="btn w-full mb-3">Reveal</button>` : `<button id="reveal-go" class="btn w-full mb-3">Show the sugar</button>`;
    openModal(`<div class="text-center">
      <div class="font-display text-xl mb-1">${def.name}</div>

      const stack=$('#cube-stack');
      for(let i=0;i<cubes;i++){ setTimeout(()=>{ const c=el('div','cube'); stack.appendChild(c); Audio.cube(i); },i*70); }
      setTimeout(()=>{
        let msg=`${cubes} teaspoons of free sugar.`;

    $('#reveal-add').addEventListener('click',()=>{

})();

function startLevel(lvl){
  if(lvl.week){ Store.set({level:lvl, screen:'week'}); UI.render('week'); return; }
  Store.set({ level:lvl, plate:[], _revealed:{} });
  clearPlate(); buildMarket(lvl.available);
  UI.render('play');
}
function serveLevel(){
  const lvl=Store.state.level; const items=Store.state.plate;
  if(!items.length){ liveSay('Add something to the plate first.'); return; }
  const res=scorePlate(items,currentCtx());
  const won=checkWin(lvl,res,items);
  Audio.arpeggio();
  if(won){ Save.markDone(lvl.id, lvl.teach); Save.addSeeds(2); Save.plant(lvl.id.toLowerCase()); }
  showDebrief(lvl,res,items,won);
}
function checkWin(lvl,res,items){
  const w=lvl.win; if(!w) return true;
  if(w.minScore && res.total<w.minScore) return false;
  if(w.minColours && res.channels.colours<w.minColours) return false;
  if(w.groups && !w.groups.every(g=>res.present.includes(g))) return false;
  if(w.needTag && !items.some(i=>(FOOD[i.id].tags||[]).includes(w.needTag))) return false;
  if(w.maxTsp!=null && res.teaspoons>w.maxTsp) return false;
  return true;
}
function showDebrief(lvl,res,items,won){
  Store.set({ screen:'debrief' });
  const stage=$('#stage-ui'), primary=$('#primary-action');
  stage.innerHTML=''; primary.innerHTML=''; $('#brief-chip').hidden=true; $('#score-chip').hidden=true;
  $('#food-rail').hidden=true;
  const cards=coachingCards(res,lvl,items);
  const w=el('div','fade-in absolute inset-0 overflow-auto px-6 py-6'); w.style.pointerEvents='auto';
  const box=el('div','max-w-md mx-auto flex flex-col gap-3');
  const head = Store.state.aud==='kid'
    ? `${'⭐'.repeat(Math.max(1,Math.round(res.total/20)))}`
    : `${res.total}/100 · ${res.teaspoons} tsp sugar`;
  box.append(el('div','text-center',`<div class="font-display text-2xl">${won?'Served!':'Good start'}</div>
    <div class="mt-1" style="color:var(--chalk-dim)">${head}</div>
    <div class="mt-1" style="color:var(--veg)">🌰 +${won?2:1} seeds</div>`));
  cards.forEach(c=>box.append(el('div',`card ${c.t}`,`<div class="font-semibold mb-1">${c.h}</div><div class="text-sm">${c.b}</div>`)));
  if(lvl.card) box.append(el('div','card fact',`<div class="text-sm">${lvl.card}</div>`));
  w.append(box);
  const retry=el('button','btn btn-ghost',{kid:'Try again',teen:'Rebuild it',adult:'Adjust'}[Store.state.aud]);
  retry.addEventListener('click',()=>startLevel(lvl));
  const hub=el('button','btn','Hub'); hub.addEventListener('click',()=>UI.render('hub'));
  primary.append(retry,hub); stage.append(w);
  if(!won) Save.addSeeds(1);
}

function showFoodCard(id){ const def=FOOD[id]; if(!def) return;
  openModal(`<div class="text-center"><div class="text-2xl mb-1">${GROUP_GLYPH[def.group]||''}</div>
    <div class="font-display text-xl mb-1">${def.name}</div>
    <div class="text-sm mb-3" style="color:var(--chalk-dim)">${def.group}${def.allergens?.length?' · allergens: '+def.allergens.join(', '):''}</div>
    <p class="text-sm mb-4">${def.fact||''}</p>
    <div class="flex gap-2"><button class="btn flex-1" id="card-add">Add to plate</button>
    <button class="btn btn-ghost flex-1" data-close>Close</button></div></div>`);
  $('#card-add')?.addEventListener('click',()=>{ closeModal(); addToPlate(id); });
}

/* ══ 16 GARDEN ═════════════════════════════════════════════════════════ */
const Garden = (() => {
  function render(stage,primary){
    plateGroup.visible=false; marketRing.visible=false;
    const w=el('div','fade-in absolute inset-0 overflow-auto px-6 py-6'); w.style.pointerEvents='auto';
    const box=el('div','max-w-md mx-auto text-center');
    box.append(el('div','font-display text-2xl mb-2','Your Garden'));
    box.append(el('div','mb-4',`<span style="color:var(--chalk-dim)">🌰 ${Save.data.seeds} seeds · ${Save.data.plants.length} plants grown</span>`));
    const g=el('div','grid grid-cols-4 gap-3 justify-items-center');
    const glyphs=['🌱','🌿','🍅','🥕','🌸','🌻','🌵','🍇','🌾','🫐','🥬','🌼'];
    Save.data.plants.forEach((p,i)=>g.append(el('div','text-3xl',glyphs[i%glyphs.length])));
    for(let i=Save.data.plants.length;i<8;i++) g.append(el('div','text-3xl',`<span style="opacity:.2">🌰</span>`));
    box.append(g);
    box.append(el('p','text-sm mt-4',`<span style="color:var(--chalk-dim)">The garden only ever grows. Play every mode to open the greenhouse.</span>`));
    if(Save.data.done.some(d=>d.startsWith('A'))&&Save.data.done.some(d=>d.startsWith('B'))&&Save.data.done.includes('C1'))
      box.append(el('div','text-4xl mt-3','🏡 Greenhouse open!'));
    w.append(box);
    const back=el('button','btn btn-ghost','← Hub'); back.addEventListener('click',()=>UI.render('hub'));
    primary.append(back); stage.append(w);
  }
  return { render };
})();

/* ══ 17 FALLBACK (Card Mode) ═══════════════════════════════════════════ */
function startCardMode(){
  $('#boot-msg').hidden=true; const f=$('#fallback'); f.hidden=false;
  let plate=[];
  const wrap=el('div','max-w-lg mx-auto');
  function draw(){
    const res=scorePlate(plate.map(id=>({id})),{tier:'teen'});
    const chan=(l,v,c)=>`<div class="mb-1"><div class="flex justify-between text-sm"><span>${l}</span></div>
      <div class="meter"><i style="width:${Math.round(v*100)}%;background:${c}"></i></div></div>`;
    wrap.innerHTML=`
      <div class="panel p-5 mb-4">
        <div class="font-display text-2xl mb-1">Plate Planet — Card Mode</div>
        <p class="text-sm mb-3" style="color:var(--chalk-dim)">Same food database and scoring, no 3D. Every lesson is here.</p>
        ${chan('Balance',res.channels.balance,'var(--veg)')}
        ${chan('Colour variety',res.channels.variety,'var(--fruit)')}
        ${chan('Fibre',res.channels.fibre,'var(--grain)')}
        ${chan('Water',res.channels.hydration,'var(--water)')}
        <div class="text-right font-display text-xl mt-2">${res.total}/100 · ${res.teaspoons} tsp</div>
      </div>
      <div class="mb-3"><b>Your plate:</b> ${plate.length?plate.map((id,i)=>`<button class="p-chip" data-rm="${i}">${FOOD[id].name} ✕</button>`).join(' '):'<span style="color:var(--chalk-dim)">empty</span>'}</div>
      <div class="flex flex-wrap gap-2">${FOOD_DB.map(f=>`<button class="food-btn" data-add="${f.id}" style="min-width:70px;min-height:70px">
        <span class="g" style="background:${GROUP_TINT[f.group]||'#333'}22;border:1px solid ${GROUP_TINT[f.group]||'#333'}">${GROUP_GLYPH[f.group]||'•'}</span>
        <span class="nm">${f.name}</span></button>`).join('')}</div>`;
    wrap.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ plate.push(b.dataset.add); draw(); });
    wrap.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ plate.splice(+b.dataset.rm,1); draw(); });
  }
  f.innerHTML=''; f.append(wrap); draw();
  Store.set({ screen:'cardmode' });
}

/* ══ 18 BOOT ═══════════════════════════════════════════════════════════ */
let raf=null, frames=[], lastT=performance.now();
function monitorFrame(now){ frames.push(now-lastT); lastT=now;
  if(frames.length===90){ const avg=frames.reduce((a,b)=>a+b)/90;
    if(avg>26 && Store.state.tier!=='low'){ /* downgrade hook */ } frames=[]; } }
function loop(t){ raf=requestAnimationFrame(loop); monitorFrame(t);
  updateMarketInertia(); Aurora.update(t); renderer.render(scene,camera); }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ cancelAnimationFrame(raf); raf=null; Audio.suspend(); }
  else if(!raf){ lastT=performance.now(); raf=requestAnimationFrame(loop); } });

// HUD wiring
$('#btn-audio').addEventListener('click',()=>{ const muted=!Store.state.muted; Store.set({muted});
  $('#btn-audio').textContent=muted?'🔇':'🔊'; if(!muted){ Audio.ensure(); Audio.resume(); } });
$('#btn-myth').addEventListener('click',()=>Myth.open());
$('#btn-about').addEventListener('click',()=>openModal(`<div><div class="font-display text-xl mb-3">About Plate Planet</div>
  <p class="text-sm mb-2">Plate Planet teaches general nutrition through balanced plates. It is educational, not medical advice.</p>
  <p class="text-sm mb-2"><b>If food or eating feels stressful, talking to a doctor or a dietitian helps.</b></p>
  <p class="text-sm mb-2" style="color:var(--chalk-dim)">No accounts, no analytics, no data leaves your device. Food and nutrition values are placeholders pending dietitian review and sourced food-composition data.</p>
  <p class="text-xs mb-4" style="color:var(--chalk-dim)">Three.js (MIT) · Tailwind (MIT) · fonts (OFL).</p>
  <button class="btn" data-close>Close</button></div>`));
$('#btn-settings').addEventListener('click',()=>{ openModal(`<div><div class="font-display text-xl mb-3">Settings</div>
  <label class="flex items-center justify-between mb-3"><span>Tap to place (no dragging)</span>
    <input id="set-tap" type="checkbox" ${Store.state.tapToPlace?'checked':''}></label>
  <label class="flex items-center justify-between mb-3"><span>Bigger text</span>
    <input id="set-txt" type="checkbox" ${getComputedStyle(document.documentElement).getPropertyValue('--txt-scale').trim()>'1'?'checked':''}></label>
  <label class="flex items-center justify-between mb-4"><span>Sound</span>
    <input id="set-snd" type="checkbox" ${!Store.state.muted?'checked':''}></label>
  <button id="set-erase" class="btn btn-ghost w-full mb-2">Erase everything</button>
  <button class="btn w-full" data-close>Done</button></div>`);
  $('#set-tap').onchange=e=>Store.set({tapToPlace:e.target.checked});
  $('#set-txt').onchange=e=>document.documentElement.style.setProperty('--txt-scale',e.target.checked?'1.2':'1');
  $('#set-snd').onchange=e=>{ Store.set({muted:!e.target.checked}); $('#btn-audio').textContent=e.target.checked?'🔊':'🔇'; if(e.target.checked){Audio.ensure();Audio.resume();} };
  $('#set-erase').onclick=()=>{ try{localStorage.removeItem(Persist.KEY);}catch{} location.reload(); };
});

// Keyboard: Esc closes modal
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

(function boot(){
  if(!probeWebGL()) return startCardMode();
  Store.set({ tier:detectTier() });
  resize(); Aurora.init(plateGroup);
  $('#boot-msg').hidden=true; $('#ui').hidden=false;
  UI.render('title');
  raf=requestAnimationFrame(loop);
})();
</script>
